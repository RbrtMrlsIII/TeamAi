name: Legacy Nemotron Review Compatibility

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for a compatibility free-router review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  review:
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: OpenRouter Free Compatibility Review
      reviewer_slug: openrouter-free-compatibility
      model: openrouter/free
      pr_number: ${{ inputs.pr_number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-openrouter-free-compatibility-auto-review -->'
      manual_marker: '<!-- teamai-openrouter-free-compatibility-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY }}
