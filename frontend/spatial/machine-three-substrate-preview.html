<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeamAi — Y1 Three.js/WebGL2 substrate preview</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: #10131a; color: #edf1f7; }
    main { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header { padding: 1rem 1.25rem; display: flex; gap: 1rem; align-items: center; justify-content: space-between; border-bottom: 1px solid #303844; }
    .status { font: 600 0.9rem ui-monospace, monospace; }
    canvas { display: block; width: 100%; height: 100%; min-height: 60vh; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button { border: 1px solid #5c6674; background: #1b212b; color: inherit; border-radius: 999px; padding: 0.55rem 0.8rem; cursor: pointer; }
    button:hover, button:focus-visible { background: #252d39; }
    @media (max-width: 600px) {
      header { align-items: flex-start; flex-direction: column; }
      canvas { min-height: 68vh; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <strong>Y1 · Three.js + WebGL2 substrate</strong>
        <div class="status" data-three-status>booting…</div>
      </div>
      <div class="controls" aria-label="Substrate preview controls">
        <button type="button" data-focus="overview">Overview</button>
        <button type="button" data-focus="seat">Seat 1</button>
      </div>
    </header>
    <canvas aria-label="Y1 Three.js WebGL2 substrate preview"></canvas>
  </main>
  <script type="module" src="./machine-three-substrate-preview.js"></script>
</body>
</html>
