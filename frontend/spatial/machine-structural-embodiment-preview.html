<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeamAi · S2-S10 Structural Embodiment Candidate</title>
<style>
:root { color-scheme: dark; }
html,body { margin:0; min-height:100%; background:#0b0f14; color:#edf2f7; font:14px/1.4 system-ui,sans-serif; }
body { min-height:100vh; display:grid; grid-template-rows:auto 1fr; }
header { padding:12px 16px; display:flex; gap:16px; align-items:center; justify-content:space-between; border-bottom:1px solid #303741; }
.status { font:600 12px ui-monospace,monospace; }
.controls { display:flex; flex-wrap:wrap; gap:8px; }
button { border:1px solid #566171; background:#1b222c; color:inherit; border-radius:999px; padding:8px 12px; }
button:focus-visible { outline:2px solid #d4dce6; outline-offset:2px; }
main { min-height:0; }
canvas { display:block; width:100%; height:100%; min-height:calc(100vh - 66px); }
@media (max-width: 620px) {
  header { align-items:flex-start; flex-direction:column; }
  canvas { min-height:calc(100vh - 126px); }
}
</style>
</head>
<body>
<header>
  <div>
    <strong>S2–S10 · Structural Embodiment Candidate</strong>
    <div class="status" data-structural-status>booting…</div>
  </div>
  <div class="controls" aria-label="Structural candidate camera views">
    <button type="button" data-view="world">World</button>
    <button type="button" data-view="seat">Seat 1 / Divisions</button>
    <button type="button" data-view="facility">Facility</button>
    <button type="button" data-action="transform">Transform</button>
  </div>
</header>
<main><canvas aria-label="S2-S10 structural embodiment candidate"></canvas></main>
<script type="module" src="/machine-structural-embodiment-preview.js"></script>
</body>
</html>
