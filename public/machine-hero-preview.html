<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#12100d" />
    <title>TeamAi · Machine Hero Preview</title>
    <link rel="stylesheet" href="./machine-hero-preview.css" />
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #12100d; color: #f0e9dd; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #2a241d 0%, #12100d 65%); }
      .machine-preview-shell { width: min(980px, calc(100vw - 32px)); min-height: 620px; position: relative; display: grid; place-items: center; }
      .machine-preview-shell::before { content: ''; position: absolute; inset: 7% 12%; border: 1px solid rgba(240,233,221,.08); border-radius: 32px; box-shadow: inset 0 0 100px rgba(255,255,255,.02); }
      .machine-preview-shell .hero-shell { width: 100%; min-height: 620px; position: relative; }
      .machine-preview-heading { position: absolute; top: 20px; left: 20px; z-index: 2; }
      .machine-preview-heading small { display:block; margin-top:6px; opacity:.62; letter-spacing:.08em; text-transform:uppercase; }
      .machine-hero-preview { position: relative !important; inset: auto !important; right: auto !important; bottom: auto !important; width: min(760px, calc(100% - 40px)) !important; background: rgba(24,20,16,.92) !important; color: #f0e9dd; }
      .machine-hero-preview__canvas { height: 420px !important; }
      .machine-hero-preview__controls button { background: rgba(255,255,255,.08) !important; color: inherit !important; }
    </style>
  </head>
  <body>
    <main class="machine-preview-shell">
      <div class="hero-shell" aria-label="Machine Hero prototype shell">
        <div class="machine-preview-heading"><strong>TeamAi Machine Hero</strong><small>semantic geometry · wiring · subject · camera</small></div>
      </div>
    </main>
    <script type="module">
      import { mountMachineWebGLPreview } from './machine-hero-webgl.js';
      mountMachineWebGLPreview();
    </script>
  </body>
</html>
