name: Canonical Browser Verification

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: canonical-browser-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Synchronize canonical Hero source
        run: node scripts/apply-cam2-tree-follow-flex.mjs


      - name: Run Playwright browser verification
        run: npm run test:e2e

      - name: Upload Playwright verification artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
