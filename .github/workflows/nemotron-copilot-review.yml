name: Nemotron Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      approve:
        description: Submit a model approval after the review. This never satisfies TeamAi's human review-readiness gate.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: nemotron-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  MAX_REVIEW_PACKET_CHARS: '300000'
  MAX_GOVERNANCE_CHARS: '140000'
  VALIDATION_POLL_SECONDS: '10'
  VALIDATION_TIMEOUT_SECONDS: '900'
  REQUIRED_CHECKS: '["governance-drift","evidence-consistency","agent-validation","Recovery integrity","Project tests + canonical package","CodeQL analyze (javascript-typescript)","Playwright browser verification"]'

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/nemotron'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          INPUT_PR: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
          else
            echo "number=$(gh api "$ISSUE_PR_URL" --jq '.number')" >> "$GITHUB_OUTPUT"
          fi

      - name: Read exact PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -r '.head.sha' /tmp/pr.json > /tmp/head.sha
          jq -r '.base.sha' /tmp/pr.json > /tmp/base.sha
          jq -r '.title' /tmp/pr.json > /tmp/title
          jq -r '.body // ""' /tmp/pr.json > /tmp/body
          echo "head=$(cat /tmp/head.sha)" >> "$GITHUB_OUTPUT"
          echo "base=$(cat /tmp/base.sha)" >> "$GITHUB_OUTPUT"

      - name: Wait for substantive exact-head validators
        id: validation-gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ steps.meta.outputs.head }}
          REQUIRED: ${{ env.REQUIRED_CHECKS }}
          POLL_SECONDS: ${{ env.VALIDATION_POLL_SECONDS }}
          TIMEOUT_SECONDS: ${{ env.VALIDATION_TIMEOUT_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          while true; do
            current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            [[ "$current_head" == "$EXPECTED_HEAD" ]] || {
              echo "Exact-head guard failed: PR moved from $EXPECTED_HEAD to $current_head."
              exit 1
            }

            checks="$(gh api "repos/$REPO/commits/$EXPECTED_HEAD/check-runs?per_page=100")"
            pending=0
            failed=0
            : > /tmp/validation-status.txt

            while IFS= read -r check_name; do
              check="$(jq -c --arg name "$check_name" --arg head "$EXPECTED_HEAD" '
                [.check_runs[] | select(.name == $name and .head_sha == $head)]
                | sort_by(.started_at // .created_at)
                | last // empty
              ' <<< "$checks")"

              if [[ -z "$check" ]]; then
                printf '%s\tPENDING\tmissing exact-head check\n' "$check_name" >> /tmp/validation-status.txt
                pending=1
                continue
              fi

              status="$(jq -r '.status' <<< "$check")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$check")"
              url="$(jq -r '.html_url' <<< "$check")"

              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                printf '%s\tPASS\t%s\n' "$check_name" "$url" >> /tmp/validation-status.txt
              elif [[ "$status" == "completed" ]]; then
                printf '%s\tFAIL\tconclusion=%s\t%s\n' "$check_name" "$conclusion" "$url" >> /tmp/validation-status.txt
                failed=1
              else
                printf '%s\tPENDING\tstatus=%s\t%s\n' "$check_name" "$status" "$url" >> /tmp/validation-status.txt
                pending=1
              fi
            done < <(jq -r '.[]' <<< "$REQUIRED")

            cat /tmp/validation-status.txt

            if (( failed == 1 )); then
              echo "VALIDATION_GATE=FAIL"
              exit 1
            fi
            if (( pending == 0 )); then
              echo "VALIDATION_GATE=PASS"
              break
            fi

            elapsed=$(( $(date +%s) - start ))
            if (( elapsed >= TIMEOUT_SECONDS )); then
              echo "Validation gate timed out after ${TIMEOUT_SECONDS}s."
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

      - name: Collect exact-head execution evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.meta.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100" > /tmp/check-runs.json
          {
            echo '=== VALIDATION GATE ==='
            echo "head=$HEAD"
            echo 'status=PASS'
            echo '=== REQUIRED CHECKS ==='
            jq -r --arg head "$HEAD" --argjson required "$REQUIRED_CHECKS" '
              .check_runs
              | map(select(.head_sha == $head))
              | map({(.name): .})
              | add // {}
              | . as $by_name
              | $required[]
              | $by_name[.]
              | [ .name, .status, (.conclusion // ""), .html_url ]
              | @tsv
            ' /tmp/check-runs.json
          } > /tmp/execution-evidence.txt

      - name: Collect governing Issue state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(grep -oE 'Issue #[0-9]+' /tmp/body | head -1 | grep -oE '[0-9]+' || true)"
          if [[ -z "$issue_number" ]]; then
            printf '%s\n' '=== GOVERNING ISSUE ===' 'No explicit Issue reference was resolved from the PR body.' > /tmp/issue-context.txt
            exit 0
          fi
          gh api "repos/$REPO/issues/$issue_number" > /tmp/issue.json
          {
            echo "=== GOVERNING ISSUE #$issue_number ==="
            jq -r '"title=" + .title, "state=" + .state, "closed_at=" + (.closed_at // "null"), "updated_at=" + .updated_at, "comments=" + (.comments | tostring), "sub_issues_completed=" + (.sub_issues_summary.completed | tostring), "sub_issues_total=" + (.sub_issues_summary.total | tostring), "sub_issues_percent=" + (.sub_issues_summary.percent_completed | tostring)'
            echo '--- Issue body ---'
            jq -r '.body // ""'
          } > /tmp/issue-context.txt

      - name: Collect governing repository context
        env:
          MAX_CHARS: ${{ env.MAX_GOVERNANCE_CHARS }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          files = [
              'Product_Law/PRODUCT_LAW.md',
              'Product_Law/WIRING.md',
              'Masterplan/MASTERPLAN.md',
              'Masterplan/NEXT_SLICES.md',
              'POLICY.md',
              'docs/SKILL_WIRING.md',
              'skills/governance/nemotron-copilot-review/SKILL.md',
          ]
          budget = int(os.environ['MAX_CHARS'])
          chunks, used = [], 0
          for path in files:
              marker = f'=== GOVERNING FILE: {path} ===\n'
              text = Path(path).read_text(encoding='utf-8') if Path(path).is_file() else '[MISSING AT EXACT PR HEAD]\n'
              chunk = marker + text + ('\n' if not text.endswith('\n') else '')
              if used + len(chunk) > budget:
                  remaining = max(0, budget - used)
                  chunks.append(chunk[:remaining])
                  chunks.append('\n[ GOVERNING CONTEXT TRUNCATED ]\n')
                  break
              chunks.append(chunk)
              used += len(chunk)
          Path('/tmp/governing-context.txt').write_text(''.join(chunks), encoding='utf-8')
          PY

      - name: Build bounded review packet
        env:
          BASE: ${{ steps.meta.outputs.base }}
          HEAD: ${{ steps.meta.outputs.head }}
          MAX_PACKET: ${{ env.MAX_REVIEW_PACKET_CHARS }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== PR ==='
            cat /tmp/title
            echo
            echo "base=$BASE"
            echo "head=$HEAD"
            echo
            cat /tmp/execution-evidence.txt
            echo
            cat /tmp/issue-context.txt
            echo
            cat /tmp/governing-context.txt
            echo
            echo '=== CHANGED FILES ==='
            git diff --name-status "$BASE...$HEAD"
            echo
            echo '=== DIFF ==='
            git diff --unified=60 "$BASE...$HEAD"
          } > /tmp/review.txt
          sed -E -i \
            -e 's/(OPENROUTER_API_KEY|FIREBASE_[A-Z0-9_]+|SUPABASE_[A-Z0-9_]+|PAYPAL_[A-Z0-9_]+)[[:space:]]*[:=][[:space:]]*[^[:space:]"'"'"'`]+/\1=[REDACTED]/g' \
            -e 's/(ghp_|github_pat_|sk-proj-|sk-)[A-Za-z0-9._-]+/[REDACTED]/g' \
            /tmp/review.txt
          if (( $(wc -c < /tmp/review.txt) > MAX_PACKET )); then
            head -c "$MAX_PACKET" /tmp/review.txt > /tmp/review.bounded
            mv /tmp/review.bounded /tmp/review.txt
            printf '\n[REVIEW PACKET TRUNCATED AT %s CHARS]\n' "$MAX_PACKET" >> /tmp/review.txt
          fi

      - name: Ask Nemotron
        env:
          OPENROUTER_API_KEY: ${{ github.token }}
          MODEL: ${{ env.MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          # The actual OpenRouter secret is injected by the repository secret through the command below.
          # Keep the environment contract explicit and fail closed if it is absent.
          OPENROUTER_KEY="${{ secrets.OPENROUTER_API_KEY }}"
          test -n "$OPENROUTER_KEY"
          python - <<'PY'
          import json, os
          from pathlib import Path
          packet = Path('/tmp/review.txt').read_text(encoding='utf-8')
          system = '\n'.join([
              'You are the independent advisory reviewer for the TeamAi repository.',
              'The packet contains exact-head execution evidence, governing documents, owning Issue state, and the PR diff.',
              'The workflow has already blocked invocation until every required substantive exact-head check completed successfully.',
              'Review repository truth, product logic, governing rules, documentation, Issue state, execution evidence, and changed code.',
              'Authority order: Product Law -> Masterplan -> POLICY/ORUCAVEAM -> Skill wiring -> applicable Skills -> Issue -> PR.',
              'Never invent requirements or recommend weakening governance or validators.',
              'Never treat a PR claim as execution proof when the packet disagrees.',
              'Never treat an open Issue as resolved merely because a PR satisfies one slice.',
              'Skipped, stale, unrelated, or head-mismatched checks are not passing evidence.',
              'If material execution/governance/Issue context is missing or truncated, use ADVISORY_ONLY instead of APPROVE.',
              '',
              'Return exactly these sections:',
              '## Verdict',
              'Use one of: APPROVE, CHANGES_REQUESTED, or ADVISORY_ONLY.',
              '## Blocking findings',
              '## Governance and evidence',
              '## Verification gaps',
              '## Non-blocking observations',
              '## Review basis',
          ])
          payload = {
              'model': os.environ['MODEL'],
              'messages': [
                  {'role': 'system', 'content': system},
                  {'role': 'user', 'content': 'Repository PR verification packet:\n\n' + packet},
              ],
              'temperature': 0.1,
              'max_tokens': 5000,
          }
          Path('/tmp/payload.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

          export OPENROUTER_API_KEY="$OPENROUTER_KEY"
          status=''
          for attempt in 1 2 3; do
            status="$(curl -sS --connect-timeout 20 --max-time 180 -o /tmp/response.json -w '%{http_code}' \
              https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H 'Content-Type: application/json' \
              -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
              -H 'X-Title: TeamAi Nemotron Copilot Review' \
              --data-binary @/tmp/payload.json || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              jq -r '.choices[0].message.content // empty' /tmp/response.json > /tmp/review.md
              test -s /tmp/review.md && exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 4)); fi
          done
          echo 'Nemotron review request failed after 3 attempts. No review was posted.' >&2
          exit 1

      - name: Post advisory review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.meta.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '<!-- teamai-nemotron-review -->'
            echo '# Nemotron Copilot Review'
            echo
            echo "Model: \`$MODEL\`"
            echo "Exact PR head: \`$HEAD\`"
            echo 'Execution gate: required substantive exact-head checks passed before model invocation.'
            echo
            cat /tmp/review.md
          } > /tmp/comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/comment.md

      - name: Optional model approval
        if: github.event_name == 'workflow_dispatch' && inputs.approve == true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.meta.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## Verdict$' /tmp/review.md && grep -q '^APPROVE$' /tmp/review.md; then
            gh api --method POST "repos/$REPO/pulls/$PR/reviews" \
              -f body="Nemotron Copilot Review: APPROVE. Exact head $HEAD. Model-generated advisory review only; TeamAi review-readiness requires separate human authorization." \
              -f event='APPROVE'
          else
            echo 'Nemotron did not return APPROVE; no model approval submitted.'
            exit 1
          fi
