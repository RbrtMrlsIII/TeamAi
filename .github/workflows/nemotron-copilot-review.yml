name: Nemotron Copilot Review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      approve:
        description: Submit a model approval after the review. This never satisfies TeamAi's human review-readiness gate.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/nemotron'))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Nemotron
      reviewer_slug: nemotron
      model: nvidia/nemotron-3.5-lightning:free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-nemotron-auto-review -->'
      manual_marker: '<!-- teamai-nemotron-review -->'
      approve: ${{ github.event_name == 'workflow_dispatch' && inputs.approve || false }}
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY }}
