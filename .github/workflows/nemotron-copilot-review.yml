name: Nemotron Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      approve:
        description: Submit a model approval after the review. This never satisfies TeamAi's human review-readiness gate.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: nemotron-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  MAX_DIFF_CHARS: '120000'
  MAX_GOVERNANCE_CHARS: '140000'
  MAX_REVIEW_PACKET_CHARS: '300000'
  VALIDATION_POLL_SECONDS: '10'
  VALIDATION_TIMEOUT_SECONDS: '900'
  REQUIRED_VALIDATORS: '["Repository Governance Integrity","Repository Full-System Verification","Security Static Analysis","Canonical Browser Verification"]'

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/nemotron'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          INPUT_PR: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
          else
            pr_number="$(gh api "$ISSUE_PR_URL" --jq '.number')"
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          fi

      - name: Read PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -r '.head.sha' /tmp/pr.json > /tmp/head.sha
          jq -r '.base.sha' /tmp/pr.json > /tmp/base.sha
          jq -r '.title' /tmp/pr.json > /tmp/title
          jq -r '.body // ""' /tmp/pr.json > /tmp/body
          jq -r '.draft' /tmp/pr.json > /tmp/draft
          echo "head=$(cat /tmp/head.sha)" >> "$GITHUB_OUTPUT"
          echo "base=$(cat /tmp/base.sha)" >> "$GITHUB_OUTPUT"
          echo "draft=$(cat /tmp/draft)" >> "$GITHUB_OUTPUT"
          echo "title<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/title >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.head }}
          fetch-depth: 0

      - name: Wait for required validator execution on the exact head
        id: validation-gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ steps.meta.outputs.head }}
          REQUIRED: ${{ env.REQUIRED_VALIDATORS }}
          POLL_SECONDS: ${{ env.VALIDATION_POLL_SECONDS }}
          TIMEOUT_SECONDS: ${{ env.VALIDATION_TIMEOUT_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          : > /tmp/validation-status.txt
          : > /tmp/validation-failures.txt

          while true; do
            current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            current_draft="$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')"
            if [[ "$current_head" != "$EXPECTED_HEAD" ]]; then
              echo "Validation gate aborted: PR head moved from $EXPECTED_HEAD to $current_head."
              exit 1
            fi

            runs_json="$(gh api "repos/$REPO/actions/runs?head_sha=$EXPECTED_HEAD&event=pull_request&per_page=100")"
            : > /tmp/validation-status.txt
            : > /tmp/validation-failures.txt
            pending=0
            failed=0

            while IFS= read -r workflow_name; do
              run_json="$(jq -c --arg name "$workflow_name" --arg head "$EXPECTED_HEAD" '
                [.workflow_runs[] | select(.name == $name and .head_sha == $head)]
                | sort_by(.created_at)
                | last // empty
              ' <<< "$runs_json")"

              if [[ -z "$run_json" ]]; then
                printf '%s\tPENDING\tno exact-head run found\n' "$workflow_name" >> /tmp/validation-status.txt
                pending=1
                continue
              fi

              status="$(jq -r '.status' <<< "$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"
              url="$(jq -r '.html_url' <<< "$run_json")"
              started="$(jq -r '.run_started_at // .created_at' <<< "$run_json")"
              completed="$(jq -r '.updated_at // ""' <<< "$run_json")"

              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                printf '%s\tPASS\t%s\t%s\t%s\n' "$workflow_name" "$started" "$completed" "$url" >> /tmp/validation-status.txt
              elif [[ "$status" == "completed" ]]; then
                printf '%s\tFAIL\tconclusion=%s\t%s\n' "$workflow_name" "$conclusion" "$url" >> /tmp/validation-failures.txt
                failed=1
              else
                printf '%s\tPENDING\tstatus=%s\t%s\n' "$workflow_name" "$status" "$url" >> /tmp/validation-status.txt
                pending=1
              fi
            done < <(jq -r '.[]' <<< "$REQUIRED")

            if (( failed == 1 )); then
              echo "Required exact-head validator failure detected."
              cat /tmp/validation-failures.txt
              exit 1
            fi

            if (( pending == 0 )); then
              echo "VALIDATION_GATE=PASS"
              echo "head=$EXPECTED_HEAD"
              cat /tmp/validation-status.txt
              {
                echo "=== VALIDATION GATE ==="
                echo "head=$EXPECTED_HEAD"
                echo "status=PASS"
                cat /tmp/validation-status.txt
              } > /tmp/execution-gate.txt
              break
            fi

            now="$(date +%s)"
            elapsed=$((now - started_at))
            if (( elapsed >= TIMEOUT_SECONDS )); then
              echo "Validation gate timed out after ${TIMEOUT_SECONDS}s."
              cat /tmp/validation-status.txt
              exit 1
            fi

            echo "Required validators are still running; polling again in ${POLL_SECONDS}s."
            cat /tmp/validation-status.txt
            sleep "$POLL_SECONDS"
          done

      - name: Collect exact-head execution evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.meta.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100" > /tmp/check-runs.json
          {
            cat /tmp/execution-gate.txt
            echo
            echo '=== CHECK-RUN EVIDENCE ==='
            jq -r --arg head "$HEAD" '
              .check_runs[]
              | select(.head_sha == $head)
              | [
                  .name,
                  .status,
                  (.conclusion // ""),
                  .started_at,
                  (.completed_at // ""),
                  .html_url,
                  (.output.title // ""),
                  (.output.summary // "")
                ]
              | @tsv
            ' /tmp/check-runs.json
          } > /tmp/execution-evidence.txt

      - name: Collect current governing Issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(grep -oE 'Issue #[0-9]+' /tmp/body | head -1 | grep -oE '[0-9]+' || true)"
          if [[ -z "$issue_number" ]]; then
            {
              echo '=== GOVERNING ISSUE ==='
              echo 'No explicit Issue reference was resolved from the PR body.'
            } > /tmp/issue-context.txt
            exit 0
          fi
          gh api "repos/$REPO/issues/$issue_number" > /tmp/issue.json
          {
            echo "=== GOVERNING ISSUE #$issue_number ==="
            jq -r '"title=" + .title, "state=" + .state, "closed_at=" + (.closed_at // "null"), "updated_at=" + .updated_at, "comments=" + (.comments | tostring), "sub_issues_completed=" + (.sub_issues_summary.completed | tostring), "sub_issues_total=" + (.sub_issues_summary.total | tostring), "sub_issues_percent=" + (.sub_issues_summary.percent_completed | tostring)'
            echo '--- Issue body ---'
            jq -r '.body // ""'
          } > /tmp/issue-context.txt

      - name: Collect governing repository context
        shell: bash
        env:
          MAX_CHARS: ${{ env.MAX_GOVERNANCE_CHARS }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          files = [
              'Product_Law/PRODUCT_LAW.md',
              'Product_Law/WIRING.md',
              'Masterplan/MASTERPLAN.md',
              'Masterplan/NEXT_SLICES.md',
              'POLICY.md',
              'docs/SKILL_WIRING.md',
              'skills/governance/nemotron-copilot-review/SKILL.md',
          ]
          budget = int(os.environ['MAX_CHARS'])
          output = []
          used = 0
          for path in files:
              marker = f'=== GOVERNING FILE: {path} ===\n'
              if not Path(path).is_file():
                  chunk = marker + '[MISSING AT EXACT PR HEAD]\n\n'
              else:
                  text = Path(path).read_text(encoding='utf-8')
                  chunk = marker + text + ('\n' if not text.endswith('\n') else '')
              if used + len(chunk) > budget:
                  remaining = max(0, budget - used)
                  output.append(chunk[:remaining])
                  output.append('\n[ GOVERNING CONTEXT TRUNCATED AT MAX_GOVERNANCE_CHARS ]\n')
                  break
              output.append(chunk)
              used += len(chunk)
          Path('/tmp/governing-context.txt').write_text(''.join(output), encoding='utf-8')
          PY

      - name: Build bounded review packet
        env:
          BASE: ${{ steps.meta.outputs.base }}
          HEAD: ${{ steps.meta.outputs.head }}
          MAX_DIFF_CHARS: ${{ env.MAX_DIFF_CHARS }}
          MAX_PACKET_CHARS: ${{ env.MAX_REVIEW_PACKET_CHARS }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== PR ==='
            cat /tmp/title
            echo
            echo '=== PR BASE / HEAD ==='
            echo "base=$BASE"
            echo "head=$HEAD"
            echo
            cat /tmp/execution-evidence.txt
            echo
            cat /tmp/issue-context.txt
            echo
            cat /tmp/governing-context.txt
            echo
            echo '=== CHANGED FILES ==='
            git diff --name-status "$BASE...$HEAD"
            echo
            echo '=== DIFF ==='
            git diff --unified=60 "$BASE...$HEAD"
          } > /tmp/review.txt
          # Do not send common credential-bearing strings to the external model.
          sed -E -i \
            -e 's/(OPENROUTER_API_KEY|FIREBASE_[A-Z0-9_]+|SUPABASE_[A-Z0-9_]+|PAYPAL_[A-Z0-9_]+)[[:space:]]*[:=][[:space:]]*[^[:space:]"'"'"'`]+/\1=[REDACTED]/g' \
            -e 's/(ghp_|github_pat_|sk-proj-|sk-)[A-Za-z0-9._-]+/[REDACTED]/g' \
            /tmp/review.txt
          if (( $(wc -c < /tmp/review.txt) > MAX_PACKET_CHARS )); then
            head -c "$MAX_PACKET_CHARS" /tmp/review.txt > /tmp/review.bounded
            mv /tmp/review.bounded /tmp/review.txt
            printf '\n[REVIEW PACKET TRUNCATED AT %s CHARS]\n' "$MAX_PACKET_CHARS" >> /tmp/review.txt
          fi

      - name: Ask Nemotron
        id: model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ env.MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          packet = Path('/tmp/review.txt').read_text()
          system = "\n".join([
              "You are the independent advisory reviewer for the TeamAi repository.",
              "",
              "The supplied packet contains repository state, governing documents, the owning Issue state, and exact-head GitHub Actions execution evidence.",
              "The workflow does not call you until the required validators have completed successfully for the exact current PR head.",
              "Treat the execution gate and exact-head check-run evidence as execution proof. Do not claim any test, browser validation, or repository-state inspection beyond what the packet actually proves.",
              "",
              "Review the supplied pull request against repository truth, product logic, governing rules, documentation, Issue state, and changed code.",
              "Authority order: Product Law -> Masterplan -> POLICY/ORUCAVEAM -> Skill wiring -> applicable Skills -> Issue -> PR.",
              "Never invent requirements. Never recommend weakening a validator or bypassing governance.",
              "Distinguish implementation defects, governance discrepancies, documentation discrepancies, Issue-state discrepancies, evidence gaps, and non-blocking observations.",
              "Do not treat the PR body as proof of execution when the execution packet says otherwise.",
              "Do not treat an open Issue as resolved merely because the PR satisfies one slice or updates a checklist. Report the actual Issue state and completion evidence.",
              "Do not treat skipped checks, stale attempts, or unrelated workflow runs as passing evidence.",
              "Do not treat a model-generated approval as human authorization.",
              "If the execution evidence, governing context, or Issue context is missing, stale, or materially truncated, use ADVISORY_ONLY instead of APPROVE.",
              "",
              "Return concise Markdown with exactly these sections:",
              "## Verdict",
              "Use one of: APPROVE, CHANGES_REQUESTED, or ADVISORY_ONLY.",
              "## Blocking findings",
              "Bullets with file/path evidence where possible. Say None if none.",
              "## Governance and evidence",
              "Check authority/index synchronization, execution evidence, Issue state, documentation alignment, and evidence boundaries.",
              "## Verification gaps",
              "List missing proof that matters to the PR's claims, even if the required validator gate passed.",
              "## Non-blocking observations",
              "Optional bullets.",
              "## Review basis",
              "State that this is model-generated advisory analysis, identify the exact head reviewed, and identify any truncation or missing context.",
          ])
          user = 'Repository PR review packet:\n\n' + packet
          payload = {
              'model': os.environ['MODEL'],
              'messages': [
                  {'role': 'system', 'content': system},
                  {'role': 'user', 'content': user},
              ],
              'temperature': 0.1,
              'max_tokens': 5000,
          }
          Path('/tmp/payload.json').write_text(json.dumps(payload))
          PY

          status=""
          for attempt in 1 2 3; do
            status="$(curl -sS --connect-timeout 20 --max-time 180 \
              -o /tmp/response.json \
              -w '%{http_code}' \
              https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H 'Content-Type: application/json' \
              -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
              -H 'X-Title: TeamAi Nemotron Copilot Review' \
              --data-binary @/tmp/payload.json || true)"

            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              jq -r '.choices[0].message.content // empty' /tmp/response.json > /tmp/review.md
              if test -s /tmp/review.md; then
                exit 0
              fi
              echo "Nemotron returned HTTP $status but no review content." >&2
            else
              provider_code="$(jq -r '.error.code // "unknown"' /tmp/response.json 2>/dev/null || echo unknown)"
              provider_message="$(jq -r '.error.message // "unavailable"' /tmp/response.json 2>/dev/null || echo unavailable)"
              echo "Nemotron request attempt $attempt failed: HTTP $status; provider=$provider_code; message=$provider_message" >&2
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 4))
            fi
          done

          echo 'Nemotron review request failed after 3 attempts. No review was posted.' >&2
          exit 1

      - name: Post advisory review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.meta.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '<!-- teamai-nemotron-review -->'
            echo '# Nemotron Copilot Review'
            echo
            echo "Model: \`$MODEL\`"
            echo "Exact PR head: \`$HEAD\`"
            echo "Execution gate: required validators passed for this exact head before model invocation."
            echo
            cat /tmp/review.md
          } > /tmp/comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/comment.md

      - name: Optional model approval
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.approve == true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.meta.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## Verdict$' /tmp/review.md && grep -q '^APPROVE$' /tmp/review.md; then
            gh api --method POST "repos/$REPO/pulls/$PR/reviews" \
              -f body="Nemotron Copilot Review: APPROVE. Exact head $HEAD. Model-generated advisory review only; TeamAi review-readiness requires separate human authorization." \
              -f event='APPROVE'
          else
            echo 'Nemotron did not return APPROVE; no model approval submitted.'
            exit 1
          fi
