name: GitHub Pages Spatial Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy validation website to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Seats plate wires (phase2 + connection + provider bind)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-seat-provider-bind-wire.mjs
          node scripts/apply-seat-division-focus-compaction.mjs

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          if [ -d public ]; then
            node scripts/apply-cam2-tree-follow-flex.mjs
            node scripts/apply-cam-r1-subject-lock.mjs
            node scripts/apply-v1.2-arrow-branch-walk.mjs
            node scripts/apply-029-division-interactive-arrow.mjs
            node scripts/apply-029-camera-click-reconcile.mjs
            node scripts/apply-seat1-connection-edge-flex.mjs
            cp -R public/. dist/
          else
            echo "public/ is required for the canonical public entrance" >&2
            exit 1
          fi

          if [ -d frontend/spatial ]; then
            mkdir -p dist/frontend/spatial
            cp -R frontend/spatial/. dist/frontend/spatial/
          else
            echo "frontend/spatial/ is required for browser ESM presentation modules" >&2
            exit 1
          fi

          mkdir -p dist/hero
          cp -R public/. dist/hero/

          test -f dist/index.html
          test -f dist/hero/index.html
          grep -q 'Enter 3D world' dist/index.html
          grep -q 'Enter 3D world' dist/hero/index.html
          test -f dist/hero/hero-flex.js
          test -f dist/hero/experience-rebaseline.js
          test -f dist/frontend/spatial/theme-root.js
          test -f dist/frontend/spatial/hero-theme-lighting-adapter.js
          test -f dist/hero/seat-connection-edge.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
