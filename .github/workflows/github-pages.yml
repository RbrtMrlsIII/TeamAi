name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy spatial UI to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Seats plate wires (phase2 + connection + provider bind)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-seat-provider-bind-wire.mjs

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          # Build 3D Hero assets in place before publishing.
          if [ -d public ]; then
            node scripts/apply-cam2-tree-follow-flex.mjs || true
          fi

          # C0 canonical public entrance: classic entrance + 3D Hero is the site ROOT.
          # See docs/TEAMAI_029_PAGES_SURFACE_MAP.md (#278).
          cp -R public/. dist/

          # Compatibility path: keep /hero/ resolvable for existing links/e2e tests.
          mkdir -p dist/hero
          cp -R public/. dist/hero/

          # Command Deck is repositioned off the public root (#276/#278).
          # It stays at /spatial/ only, as a pre-authentication staging surface --
          # NOT the public front door. Do not point "/" at this build.
          mkdir -p dist/spatial
          cp -R frontend/spatial/. dist/spatial/

          # Guard: root must be the classic entrance, not the Command Deck.
          test -f dist/index.html
          test -f dist/hero.css
          test -f dist/hero-flex.js

          # Deterministic smoke check (#278 item B): fail the build if root
          # content silently reverts to the Command Deck shell.
          if ! grep -q "Enter 3D world" dist/index.html; then
            echo "::error::Pages root is not the classic entrance (missing 'Enter 3D world' CTA). Refusing to publish." >&2
            exit 1
          fi
          if grep -q "Command Deck" dist/index.html; then
            echo "::error::Pages root still resolves to the Command Deck shell. Refusing to publish." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
