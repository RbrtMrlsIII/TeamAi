name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TeamAi public website to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Seats plate wires (phase2 + connection + provider bind)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-seat-provider-bind-wire.mjs

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          # Canonical public front door: classic website entrance from public/.
          # This makes the normal github.io/TeamAi/ surface match the owner-directed C0 shape.
          if [ -d public ]; then
            node scripts/apply-cam2-tree-follow-flex.mjs
            cp -R public/. dist/
          else
            echo "public/ is required for the canonical public entrance" >&2
            exit 1
          fi

          # Preserve the existing 3D Hero URL as a compatibility route.
          mkdir -p dist/hero
          cp -R public/. dist/hero/

          # Command Deck is retired as a published product surface. Its historical source
          # remains repository-owned for reconstruction/history but is not deployed.

          # Deterministic deployment smoke checks for the published public surfaces.
          test -f dist/index.html
          test -f dist/hero/index.html
          grep -q 'Enter 3D world' dist/index.html
          grep -q 'Enter 3D world' dist/hero/index.html
          test -f dist/hero/hero-flex.js
          test -f dist/hero/experience-rebaseline.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
