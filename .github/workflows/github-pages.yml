name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy spatial UI to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Seats plate wires (phase2 + connection + provider bind)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-seat-provider-bind-wire.mjs

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          # Publish spatial Command Deck at site ROOT so github.io/TeamAi/ resolves.
          # (Previously nested under dist/spatial/ → root 404 while /spatial/ worked.)
          cp -R frontend/spatial/. dist/

          # Keep legacy /spatial/ path working (bookmark / docs compatibility).
          mkdir -p dist/spatial
          cp -R frontend/spatial/. dist/spatial/

          # Optional: 3D Hero presentation under /hero/ (public/ self-contained).
          if [ -d public ]; then
            mkdir -p dist/hero
            cp -R public/. dist/hero/
          fi

          # Guard: root must have index.html or Pages shows 404.
          test -f dist/index.html
          test -f dist/theme-root.css
          test -f dist/shell-nav.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
