name: one-time Masterplan reconciliation

on:
  push:
    branches: [fix/278-retire-spine-settings-smoke]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor == 'RbrtMrlsIII' || github.actor == 'teamaiofficialph'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Masterplan chronologically
        env:
          TARGET: MASTERPLAN.md
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MASTERPLAN.md')
          text = path.read_text(encoding='utf-8')

          marker = """**Boundary:** the current census is not a complete implementation census. Never fabricate future tree numbers, branch IDs, geometry, backend ownership, skill catalog entries, or completion status.\n\n### 03.9.8 — TREE-HERO-SEAT configuration/lifecycle reconciliation\n"""

          insertion = """**Boundary:** the current census is not a complete implementation census. Never fabricate future tree numbers, branch IDs, geometry, backend ownership, skill catalog entries, or completion status.\n\n### 03.9.1A — Census-first population and division mapping\n\nThis is the first executable construction step after the C0–C7 camera/travel foundation. It is intentionally census-first: determine **what the machine contains before deciding how it moves**. The Tree Census is the structural inventory; this Masterplan branch is the chronological execution order.\n\n```text\n03.9.1A CENSUS-FIRST MACHINE MAP\n├── 03.9.1A.1 Classify each candidate root\n│   ├── whole machine\n│   ├── semantic tree\n│   ├── tree instance\n│   ├── division / branch\n│   ├── cross-tree mechanism\n│   └── non-spatial authority\n├── 03.9.1A.2 Establish semantic identity\n│   ├── treeID\n│   ├── branchId\n│   ├── parent identity\n│   └── instance identity where a tree repeats\n├── 03.9.1A.3 Count structure\n│   ├── direct divisions / branches\n│   ├── recursive sub-branches\n│   ├── maximum known depth\n│   └── undefined vs evidenced nodes\n├── 03.9.1A.4 Map responsibility and payload\n│   ├── product meaning\n│   ├── UI / configuration payload\n│   ├── accessibility payload\n│   └── durable authority / backend seam\n├── 03.9.1A.5 Freeze the population model\n│   ├── minimum valid state: 1 active Seat\n│   ├── 2 active Seats\n│   ├── 3 active Seats\n│   ├── 4 active Seats\n│   ├── 5 active Seats\n│   ├── 6 active Seats\n│   ├── 7 active Seats\n│   └── 8 active Seats\n├── 03.9.1A.6 Define Seat unlock presentation\n│   ├── durable unlock remains entitlement authority\n│   ├── newly available Seat instance enters the machine\n│   ├── mechanical insertion / reveal state\n│   ├── accessibility focus / announcement / state\n│   ├── reduced-motion equivalent\n│   └── stable post-unlock state\n└── 03.9.1A.7 Reconcile the census\n    ├── CSV\n    ├── JSON\n    ├── MD\n    └── XML\n```\n\n#### Population truth required before geometry\n\nThe machine is not eight different Hero layouts. It is one mechanical machine with a population of active Seat instances from **one through eight**. The one-Seat state is the minimum useful Hero and is intentionally compact: one active WebAi Seat, the applicable Seat/product divisions, and the shared workspace/chat surface. A two-Seat state introduces a second active Seat instance without duplicating the Seat tree definition. Increasing population adds instances; it does not create new semantic tree definitions.\n\n```text\n1 Seat  → minimum compressed mechanical Hero\n2 Seats → two active Seat instances\n3 Seats → three active Seat instances\n4 Seats → four active Seat instances\n5 Seats → five active Seat instances\n6 Seats → six active Seat instances\n7 Seats → seven active Seat instances\n8 Seats → maximum configured Seat population\n```\n\nCapacity, configured Seat, eligible Seat, active Seat, and participating Seat remain distinct states. A rendered slot is not durable authority, and an inactive/unconfigured slot must not imply a runnable WebAi.\n\n#### No-animation-before-census rule\n\nDo **not** finalize expansion timing, transition roots, camera roots, lighting/effects roots, or electrical choreography for an un-censused division. Those are downstream presentation/verification roots that consume the semantic map.\n\n#### First executable Seat slice\n\nThe first machine construction slice is **Seat 1**, not a generic “Seat Shell implementation.” Before implementation begins, the governed record must show the complete Seat-1 map: `treeID`, instance identity, all direct divisions, all known sub-branches, payload, state surface, accessibility surface, and the minimum one-Seat Hero composition.\n\n**Skill routing:** `skills/execution/orucaveam/SKILL.md` + `skills/frontend/spatial/hierarchy-runtime/SKILL.md` + `skills/frontend/spatial/seat-shell-hierarchy/SKILL.md` + `skills/governance/masterplan-skill-wiring/SKILL.md` + `skills/verification/browser-smoke/SKILL.md` + applicable responsive/accessibility/motion skills. Census-only classification remains docs/evidence work until the implementation boundary is explicitly authorized.\n\n### 03.9.8A — Seat-1 reference machine and outer-to-inner construction order\n\nOnce Census Slice 01 is frozen, construction proceeds **one Seat instance/division at a time**. The first completed Seat becomes the reference implementation for reusable machine contracts, not a universal geometry template.\n\n```text\n03.9.8A SEAT-1 REFERENCE CONSTRUCTION\n├── 03.9.8A.1 Seat-1 machine shell\n│   ├── tree identity\n│   ├── instance identity\n│   └── minimum one-Seat composition\n├── 03.9.8A.2 Seat-1 divisions, one at a time\n│   ├── SEAT_SHELL\n│   ├── SEAT_CONNECTION\n│   ├── SEAT_BEHAVIOR\n│   ├── SEAT_TOOLKIT\n│   ├── SEAT_CAPABILITIES\n│   ├── SEAT_AUTHORIZATION\n│   ├── SEAT_WORKSPACE_SCOPE\n│   └── SEAT_TASK_EVIDENCE\n├── 03.9.8A.3 After each division map, add applicable downstream roots\n│   ├── payload-driven geometry\n│   ├── expansion / adjacency\n│   ├── transition choreography\n│   ├── semantic camera subject/travel\n│   ├── accessibility / focus / reduced motion\n│   ├── effects only when semantically justified\n│   └── in-page Smoke probe + browser evidence\n├── 03.9.8A.4 Complete Seat-1 and freeze its machine contract\n├── 03.9.8A.5 Reuse the contract for Seat-2 through Seat-8 instances\n│   └── validate each unlock/population transition without cloning the tree definition\n└── 03.9.8A.6 Descend inward after the outer Seat ring is reconciled\n    ├── R2 Setup / Configuration ring\n    ├── R1 Backend Display / Connection ring\n    └── R0 Workspace core\n```\n\nThe outer-to-inner order is deliberate. The machine first establishes the participating Seat layer, then the nearer setup/backend rings, and finally the workspace center. Cross-ring topology is constructed only after the owning nodes and corridors exist. Turn-loop electricity remains downstream of real graph edges.\n\n**Completion gate for each division:** census identity proven → payload proven → state model proven → geometry/clearance proven → expansion/adjacency proven → camera relationship proven → accessibility/responsive/reduced-motion proven → applicable Smoke probe proven → browser evidence recorded → census representations reconciled. A visual mesh alone never closes the division.\n\n**Skill routing:** same `03.9` spatial/hierarchy/Seat/verification routing above, adding concrete connection/backend skills only when a division crosses into a durable backend seam.\n\n### 03.9.8 — TREE-HERO-SEAT configuration/lifecycle reconciliation\n"""

          if text.count(marker) != 1:
              raise SystemExit(f'Expected exactly one Masterplan insertion marker, found {text.count(marker)}')

          text = text.replace(marker, insertion, 1)
          path.write_text(text, encoding='utf-8')
          print('MASTERPLAN reconciliation applied')
          PY

      - name: Validate insertion
        run: |
          grep -n "03.9.1A — Census-first population and division mapping" MASTERPLAN.md
          grep -n "03.9.8A — Seat-1 reference machine and outer-to-inner construction order" MASTERPLAN.md
          grep -n "3.9.1A.7 Reconcile the census" MASTERPLAN.md
          test "$(grep -c "03.9.1A — Census-first population and division mapping" MASTERPLAN.md)" -eq 1
          test "$(grep -c "03.9.8A — Seat-1 reference machine and outer-to-inner construction order" MASTERPLAN.md)" -eq 1

      - name: Commit reconciliation and remove runner
        run: |
          rm .github/workflows/_one_time_masterplan_reconcile.yml
          git config user.name "TeamAi automated reconciliation"
          git config user.email "team.ai.official.ph@gmail.com"
          git add MASTERPLAN.md .github/workflows/_one_time_masterplan_reconcile.yml
          git commit -m "docs(029): establish census-first tree-machine execution checklist"
          git push origin HEAD:fix/278-retire-spine-settings-smoke
