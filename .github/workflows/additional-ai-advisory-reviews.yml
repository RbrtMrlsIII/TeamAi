name: Additional AI Advisory Reviews

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      slot:
        description: Free-router review slot
        required: true
        type: choice
        options: [free-1, free-2, free-3, free-4, free-5]
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  resolve_manual_slot:
    name: resolve-manual-advisory-slot
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (github.event.comment.body == '/openrouter-free' ||
        startsWith(github.event.comment.body, '/free-1') ||
        startsWith(github.event.comment.body, '/free-2') ||
        startsWith(github.event.comment.body, '/free-3') ||
        startsWith(github.event.comment.body, '/free-4') ||
        startsWith(github.event.comment.body, '/free-5') ||
        startsWith(github.event.comment.body, '/openrouter-free-1') ||
        startsWith(github.event.comment.body, '/openrouter-free-2') ||
        startsWith(github.event.comment.body, '/openrouter-free-3') ||
        startsWith(github.event.comment.body, '/openrouter-free-4') ||
        startsWith(github.event.comment.body, '/openrouter-free-5')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.target.outputs.head_sha }}
    steps:
      - name: Read target PR head
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" > /tmp/target-pr.json
          state="$(jq -r '.state' /tmp/target-pr.json)"
          [[ "$state" == "open" ]] || { echo "Manual advisory review requires an open pull request."; exit 1; }
          head_sha="$(jq -r '.head.sha' /tmp/target-pr.json)"
          test -n "$head_sha" && test "$head_sha" != "null"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
      - name: Checkout exact target PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 1
      - name: Resolve requested slot from canonical manifest
        id: resolve
        shell: bash
        env:
          DISPATCH_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          TARGET_PR: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          data=json.loads(Path('.github/teamai/authority-manifest.yml').read_text(encoding='utf-8'))
          advisory=data.get('advisory_review') or {}
          if advisory.get('route') != 'openrouter/free': raise SystemExit('Unexpected advisory route.')
          slots=advisory.get('slots') or []
          slot_by_number={int(s['slot']):s for s in slots}
          requested=os.environ.get('DISPATCH_SLOT','').strip()
          if not requested:
              body=os.environ.get('COMMENT_BODY','').strip()
              if body == '/openrouter-free': requested='free-1'
              else:
                  match=re.match(r'^/(?:free|openrouter-free)-(1|2|3|4|5)', body)
                  requested=f'free-{match.group(1)}' if match else ''
          match=re.fullmatch(r'free-([1-5])', requested)
          if not match: raise SystemExit('Manual advisory command did not resolve to a supported free-router slot.')
          number=int(match.group(1)); entry=slot_by_number.get(number)
          if not entry: raise SystemExit(f'Manual advisory slot {number} is absent from the canonical registry.')
          if entry.get('manual_command') not in {'/openrouter-free' if number == 1 else f'/free-{number}', f'/openrouter-free-{number}'}:
              raise SystemExit(f'Manual command mapping drifted for slot {number}.')
          pr=os.environ.get('TARGET_PR','').strip()
          if not pr: raise SystemExit('A pull request number is required for manual advisory review.')
          matrix={'include':[{'slot':number,'credential_alias':entry['credential_alias'],'start_delay_seconds':0}]}
          Path('/tmp/matrix.json').write_text(json.dumps(matrix,separators=(',',':')),encoding='utf-8')
          print('matrix=' + json.dumps(matrix,separators=(',',':')))
          print('pr_number=' + pr)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('matrix=' + json.dumps(matrix,separators=(',',':')) + '\n')
              out.write('pr_number=' + pr + '\n')
          PY

  manual_free:
    name: OpenRouter Free Manual Slot ${{ matrix.slot }}
    needs: resolve_manual_slot
    if: needs.resolve_manual_slot.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_manual_slot.outputs.matrix) }}
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: OpenRouter Free Manual Slot ${{ matrix.slot }}
      reviewer_slug: openrouter-free-manual-${{ matrix.slot }}
      credential_alias: ${{ matrix.credential_alias }}
      pr_number: ${{ needs.resolve_manual_slot.outputs.pr_number }}
      expected_head: ${{ needs.resolve_manual_slot.outputs.head_sha }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-openrouter-free-manual-${{ matrix.slot }}-auto-review -->'
      manual_marker: '<!-- teamai-openrouter-free-manual-${{ matrix.slot }}-review -->'
    secrets:
      api_key: ${{ secrets[matrix.credential_alias] }}
