name: Additional AI Advisory Reviews

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      reviewer:
        description: Reviewer to invoke
        required: true
        type: choice
        options:
          - free-router
          - poolside
          - deepseek
          - qwen
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  free_router:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.reviewer == 'free-router') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/free-router'))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: OpenRouter Free Router
      reviewer_slug: free-router
      model: openrouter/free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-free-router-auto-review -->'
      manual_marker: '<!-- teamai-free-router-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_OPENAI }}

  poolside:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.reviewer == 'poolside') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/poolside'))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Poolside
      reviewer_slug: poolside
      model: poolside/laguna-s-2.1:free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-poolside-auto-review -->'
      manual_marker: '<!-- teamai-poolside-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_POOLSIDE }}

  deepseek:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.reviewer == 'deepseek') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/deepseek'))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: DeepSeek
      reviewer_slug: deepseek
      model: deepseek/deepseek-v4-flash:free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-deepseek-auto-review -->'
      manual_marker: '<!-- teamai-deepseek-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_DEEPSEEK }}

  qwen:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.reviewer == 'qwen') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/qwen'))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Qwen
      reviewer_slug: qwen
      model: qwen/qwen3-coder:free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-qwen-auto-review -->'
      manual_marker: '<!-- teamai-qwen-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_GWEN }}
