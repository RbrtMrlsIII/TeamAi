name: Additional AI Advisory Reviews

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      reviewer:
        description: Reviewer to invoke
        required: true
        type: choice
        options:
          - ling
          - poolside
          - laguna
          - dots3
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  ling:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.reviewer == 'ling') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/ling'))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Ling 3.0 Flash
      reviewer_slug: ling
      model: inclusionai/ling-3.0-flash:free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-ling-auto-review -->'
      manual_marker: '<!-- teamai-ling-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_OPENAI }}

  poolside:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.reviewer == 'poolside') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/poolside'))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Poolside
      reviewer_slug: poolside
      model: poolside/laguna-xs-2.1:free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-poolside-auto-review -->'
      manual_marker: '<!-- teamai-poolside-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_POOLSIDE }}

  laguna:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.reviewer == 'laguna') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/laguna'))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Laguna
      reviewer_slug: laguna
      model: dots-studio/dots-3-note-preview:free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-laguna-auto-review -->'
      manual_marker: '<!-- teamai-laguna-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_DEEPSEEK }}

  dots3:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.reviewer == 'dots3') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/dots3'))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Dots3-Note Preview
      reviewer_slug: dots3
      model: dots-studio/dots-3-note-preview:free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-dots3-auto-review -->'
      manual_marker: '<!-- teamai-dots3-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_GWEN }}
