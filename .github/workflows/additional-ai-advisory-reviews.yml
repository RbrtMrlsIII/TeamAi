name: Additional AI Advisory Reviews

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      slot:
        description: Free-router review slot
        required: true
        type: choice
        options: [free-1, free-2, free-3, free-4, free-5]
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  free:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/openrouter-free') ||
        startsWith(github.event.comment.body, '/free-1') ||
        startsWith(github.event.comment.body, '/free-2') ||
        startsWith(github.event.comment.body, '/free-3') ||
        startsWith(github.event.comment.body, '/free-4') ||
        startsWith(github.event.comment.body, '/free-5')))
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: OpenRouter Free Manual
      reviewer_slug: openrouter-free-manual
      model: openrouter/free
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
      invocation_class: manual
      automatic_marker: '<!-- teamai-openrouter-free-manual-auto-review -->'
      manual_marker: '<!-- teamai-openrouter-free-manual-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY }}
