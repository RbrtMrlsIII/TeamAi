name: Firestore live contention and recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run two-worker contention + restart/recovery probe
        env:
          TEAMAI_FIREBASE_PROJECT_ID: team-ai-official
          TEAMAI_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.TEAMAI_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEAMAI_FIREBASE_TEST_UID: ${{ secrets.TEAMAI_FIREBASE_TEST_UID }}
          TEAMAI_FIREBASE_TEST_WORKPLACE_ID: ${{ secrets.TEAMAI_FIREBASE_TEST_WORKPLACE_ID }}
          TEAMAI_FIREBASE_TEST_PROJECT_ID: ${{ secrets.TEAMAI_FIREBASE_TEST_PROJECT_ID }}
        run: node scripts/firestore-live-contention-recovery.mjs
