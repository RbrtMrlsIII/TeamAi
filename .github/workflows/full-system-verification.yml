name: Repository Full-System Verification

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recovery-integrity:
    name: Recovery integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate TeamAi recovery records
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/recovery/TeamAi_PRE_029_GITHUB_RECOVERY_MANIFEST.md
          test -f docs/recovery/RECOVERY_POLICY.md
          grep -q '9990dbaf02b7c6d6bc8f55ae21889b4e633f40b066b515e7b97619bde3f7e89a' docs/recovery/TeamAi_PRE_029_GITHUB_RECOVERY_MANIFEST.md
          grep -q 'RESTORED_BASELINE' docs/recovery/TeamAi_PRE_029_GITHUB_RECOVERY_MANIFEST.md
          grep -q 'HomeFinder-Official' docs/recovery/RECOVERY_POLICY.md
          ! test -e HomeFinder-Official

  project-tests:
    name: Project tests + canonical package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Run build-system script reference audit
        run: npm run build-system:audit
      - name: Run backend authority audit
        run: npm run backend:authority-audit
      - name: Run typecheck
        run: npm run typecheck
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - name: Typecheck trusted Edge entrypoints
        run: |
          deno check --node-modules-dir=auto supabase/functions/teamai-task-execute/index.ts
          deno check --node-modules-dir=auto supabase/functions/teamai-task-continuation-request/index.ts
      - name: Verify committed machine spatial runtime parity
        run: npm run machine:sync:check
      - name: Run project tests
        run: npm test
      - name: Build and verify Full Project ZIP
        run: npm run project:package
      - name: Require Full Project ZIP output
        shell: bash
        run: |
          set -euo pipefail
          test -f TeamAi-Full-Project.zip
          test -s TeamAi-Full-Project.zip
      - name: Upload Full Project ZIP verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-project-${{ github.event.pull_request.head.sha || github.sha }}
          path: TeamAi-Full-Project.zip
          if-no-files-found: error
          retention-days: 30
