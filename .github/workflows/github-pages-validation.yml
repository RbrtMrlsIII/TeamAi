name: GitHub Pages validation

on:
  push:
    branches:
      - validation/teamai-029-live

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-validation
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare spatial site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/spatial
          cp -R frontend/spatial/. dist/spatial/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
