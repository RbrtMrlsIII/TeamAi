name: AI Advisory Review Runner

on:
  workflow_call:
    inputs:
      reviewer:
        description: Reviewer display name
        required: true
        type: string
      credential_alias:
        description: Non-secret credential alias used by this advisory slot
        required: true
        type: string
      reviewer_slug:
        description: Stable reviewer identifier
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      expected_head:
        description: Expected exact head SHA. Empty for a manual review that targets the current head.
        required: false
        default: ''
        type: string
      invocation_class:
        description: automatic or manual
        required: true
        type: string
      start_delay_seconds:
        description: Bounded automatic slot launch delay in seconds
        required: false
        default: 0
        type: number
      automatic_marker:
        description: Reviewer-specific automatic marker
        required: true
        type: string
      manual_marker:
        description: Reviewer-specific manual marker
        required: true
        type: string
    secrets:
      api_key:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-review-runner-${{ inputs.reviewer_slug }}-${{ inputs.pr_number }}-${{ inputs.expected_head || 'manual' }}
  cancel-in-progress: true

env:
  MAX_REVIEW_PACKET_CHARS: '300000'
  MAX_GOVERNANCE_CHARS: '140000'
  MAX_REVIEW_CHARS: '12000'
  VALIDATION_POLL_SECONDS: '10'
  VALIDATION_TIMEOUT_SECONDS: '900'
  REQUIRED_CHECKS: '["governance-drift","evidence-consistency","agent-validation","Recovery integrity","Project tests + canonical package","CodeQL analyze (javascript-typescript)","Playwright browser verification"]'

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          actual_head="$(jq -r '.head.sha' /tmp/pr.json)"
          base="$(jq -r '.base.sha' /tmp/pr.json)"
          title="$(jq -r '.title' /tmp/pr.json)"
          body="$(jq -r '.body // ""' /tmp/pr.json)"
          if [[ -n "$EXPECTED_HEAD" && "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "Exact-head guard failed: expected $EXPECTED_HEAD but current PR head is $actual_head."
            exit 1
          fi
          printf '%s\n' "$actual_head" > /tmp/head.sha
          printf '%s\n' "$base" > /tmp/base.sha
          printf '%s\n' "$title" > /tmp/title
          printf '%s\n' "$body" > /tmp/body
          echo "head=$actual_head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.head }}
          fetch-depth: 0

      - name: Wait for substantive exact-head validators
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ steps.meta.outputs.head }}
          REQUIRED: ${{ env.REQUIRED_CHECKS }}
          POLL_SECONDS: ${{ env.VALIDATION_POLL_SECONDS }}
          TIMEOUT_SECONDS: ${{ env.VALIDATION_TIMEOUT_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(gh api "repos/$REPO/pulls/$PR" --jq '.base.ref')"
          if [[ "$base_ref" != "main" ]]; then
            REQUIRED="$(jq -c 'del(.[] | select(. == "CodeQL analyze (javascript-typescript)"))' <<< "$REQUIRED")"
          fi
          start="$(date +%s)"
          while true; do
            current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            [[ "$current_head" == "$EXPECTED_HEAD" ]] || {
              echo "Exact-head guard failed: PR moved from $EXPECTED_HEAD to $current_head."
              exit 1
            }
            checks="$(gh api "repos/$REPO/commits/$EXPECTED_HEAD/check-runs?per_page=100")"
            pending=0
            failed=0
            : > /tmp/validation-status.txt
            while IFS= read -r check_name; do
              check="$(jq -c --arg name "$check_name" --arg head "$EXPECTED_HEAD" '[.check_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.started_at // .created_at) | last // empty' <<< "$checks")"
              if [[ -z "$check" ]]; then
                printf '%s\tPENDING\tmissing exact-head check\n' "$check_name" >> /tmp/validation-status.txt
                pending=1
                continue
              fi
              status="$(jq -r '.status' <<< "$check")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$check")"
              url="$(jq -r '.html_url' <<< "$check")"
              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                printf '%s\tPASS\t%s\n' "$check_name" "$url" >> /tmp/validation-status.txt
              elif [[ "$status" == "completed" ]]; then
                printf '%s\tFAIL\tconclusion=%s\t%s\n' "$check_name" "$conclusion" "$url" >> /tmp/validation-status.txt
                failed=1
              else
                printf '%s\tPENDING\tstatus=%s\t%s\n' "$check_name" "$status" "$url" >> /tmp/validation-status.txt
                pending=1
              fi
            done < <(jq -r '.[]' <<< "$REQUIRED")
            cat /tmp/validation-status.txt
            if (( failed == 1 )); then
              echo 'VALIDATION_GATE=FAIL'
              exit 1
            fi
            if (( pending == 0 )); then
              echo 'VALIDATION_GATE=PASS'
              break
            fi
            elapsed=$(( $(date +%s) - start ))
            if (( elapsed >= TIMEOUT_SECONDS )); then
              echo "Validation gate timed out after ${TIMEOUT_SECONDS}s."
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

      - name: Collect exact-head execution evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.meta.outputs.head }}
          REQUIRED_CHECKS: ${{ env.REQUIRED_CHECKS }}
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(gh api "repos/$REPO/pulls/${{ inputs.pr_number }}" --jq '.base.ref')"
          required_checks="$REQUIRED_CHECKS"
          if [[ "$base_ref" != "main" ]]; then
            required_checks="$(jq -c 'del(.[] | select(. == "CodeQL analyze (javascript-typescript)"))' <<< "$required_checks")"
          fi
          gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100" > /tmp/check-runs.json
          test -s /tmp/check-runs.json
          {
            echo '=== VALIDATION GATE ==='
            echo "head=$HEAD"
            echo 'status=PASS'
            echo '=== REQUIRED CHECKS ==='
            jq -r --arg head "$HEAD" --argjson required "$required_checks" '.check_runs | map(select(.head_sha == $head)) | map({(.name): .}) | add // {} | . as $by_name | $required[] | $by_name[.] | [ .name, .status, (.conclusion // ""), .html_url, (.output.title // ""), (.output.summary // "") ] | @tsv' /tmp/check-runs.json
          } > /tmp/execution-evidence.txt

      - name: Collect governing Issue state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(python - <<'PY'
          import re
          from pathlib import Path
          body = Path('/tmp/body').read_text(encoding='utf-8')
          match = re.search(r'(?im)^\s*(?:[-*]\s*)?(?:Owning|Governing)\s+Issue:\s*(?:\*\*)?#(\d+)', body)
          print(match.group(1) if match else '')
          PY
          )"
          if [[ -z "$issue_number" ]]; then
            echo 'PRE_PROVIDER_FAILURE: PR body must contain an explicit Owning Issue: #N or Governing Issue: #N field.' > /tmp/provider-failure.txt
            exit 1
          fi
          gh api "repos/$REPO/issues/$issue_number" > /tmp/issue.json
          test -s /tmp/issue.json
          {
            echo "=== GOVERNING ISSUE #$issue_number ==="
            jq -r '"title=" + .title, "state=" + .state, "closed_at=" + (.closed_at // "null"), "updated_at=" + .updated_at, "comments=" + (.comments | tostring)' /tmp/issue.json
            echo '--- Issue body ---'
            jq -r '.body // ""' /tmp/issue.json
          } > /tmp/issue-context.txt

      - name: Collect governing repository context
        env:
          MAX_CHARS: ${{ env.MAX_GOVERNANCE_CHARS }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          files = [
              'Product_Law/PRODUCT_LAW.md',
              'Product_Law/WIRING.md',
              'Masterplan/MASTERPLAN.md',
              'Masterplan/NEXT_SLICES.md',
              'POLICY.md',
              'AI_ASSISTANT_READ_ME.md',
              'docs/SKILL_WIRING.md',
              'skills/governance/ai-advisory-review/SKILL.md',
              'skills/governance/machine-builder/SKILL.md',
              'skills/frontend/spatial/hierarchy-runtime/SKILL.md',
              'skills/frontend/spatial/seat-shell-hierarchy/SKILL.md',
              'skills/frontend/spatial/transition/SKILL.md',
              'docs/TEAMAI_3D_HERO_TREE_CENSUS.md',
          ]
          budget = int(os.environ['MAX_CHARS'])
          chunks, used = [], 0
          for path in files:
              marker = f'=== GOVERNING FILE: {path} ===\n'
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8') if file_path.is_file() else '[MISSING AT EXACT PR HEAD]\n'
              chunk = marker + text + ('\n' if not text.endswith('\n') else '')
              if used + len(chunk) > budget:
                  remaining = max(0, budget - used)
                  chunks.append(chunk[:remaining])
                  chunks.append('\n[ GOVERNING CONTEXT TRUNCATED ]\n')
                  break
              chunks.append(chunk)
              used += len(chunk)
          Path('/tmp/governing-context.txt').write_text(''.join(chunks), encoding='utf-8')
          PY

      - name: Build bounded review packet
        env:
          BASE: ${{ steps.meta.outputs.base }}
          HEAD: ${{ steps.meta.outputs.head }}
          MAX_PACKET: ${{ env.MAX_REVIEW_PACKET_CHARS }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== PR ==='
            cat /tmp/title
            echo
            echo "base=$BASE"
            echo "head=$HEAD"
            echo
            cat /tmp/execution-evidence.txt
            echo
            cat /tmp/issue-context.txt
            echo
            cat /tmp/governing-context.txt
            echo
            echo '=== CHANGED FILES ==='
            git diff --name-status "$BASE...$HEAD"
            echo
            echo '=== DIFF ==='
            git diff --unified=60 "$BASE...$HEAD"
          } > /tmp/review.txt
          sed -E -i \
            -e 's/(OPENROUTER_API_KEY|FIREBASE_[A-Z0-9_]+|SUPABASE_[A-Z0-9_]+|PAYPAL_[A-Z0-9_]+)[[:space:]]*[:=][[:space:]]*[^[:space:]"'"'"'`]+/\1=[REDACTED]/g' \
            -e 's/(ghp_|github_pat_|sk-proj-|sk-or-v1-)[A-Za-z0-9._-]+/[REDACTED]/g' \
            /tmp/review.txt
          if (( $(wc -c < /tmp/review.txt) > MAX_PACKET )); then
            head -c "$MAX_PACKET" /tmp/review.txt > /tmp/review.bounded
            mv /tmp/review.bounded /tmp/review.txt
            printf '\n[REVIEW PACKET TRUNCATED AT %s CHARS]\n' "$MAX_PACKET" >> /tmp/review.txt
          fi

      - name: Apply bounded automatic launch stagger
        if: inputs.invocation_class == 'automatic' && inputs.start_delay_seconds > 0
        env:
          START_DELAY_SECONDS: ${{ inputs.start_delay_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          case "$START_DELAY_SECONDS" in
            ''|*[!0-9]*) echo "Invalid start delay: $START_DELAY_SECONDS" >&2; exit 1 ;;
          esac
          echo "Applying ${START_DELAY_SECONDS}s automatic slot launch stagger."
          sleep "$START_DELAY_SECONDS"

      - name: Confirm exact head before model invocation
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ steps.meta.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          [[ "$current_head" == "$EXPECTED_HEAD" ]] || {
            echo "Exact-head guard failed immediately before model invocation: $current_head != $EXPECTED_HEAD."
            exit 1
          }

      - name: Ask reviewer model
        id: invoke_model
        env:
          OPENROUTER_API_KEY: ${{ secrets.api_key }}
          MODEL: openrouter/free
          CREDENTIAL_ALIAS: ${{ inputs.credential_alias }}
          ALLOWED_CREDENTIAL_ALIASES: OPENROUTER_API_KEY OPENROUTER_API_KEY_OPENAI OPENROUTER_API_KEY_POOLSIDE OPENROUTER_API_KEY_DEEPSEEK OPENROUTER_API_KEY_GWEN
          REVIEWER: ${{ inputs.reviewer }}
          INVOCATION_CLASS: ${{ inputs.invocation_class }}
          START_DELAY_SECONDS: ${{ inputs.start_delay_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          case " $ALLOWED_CREDENTIAL_ALIASES " in
            *" $CREDENTIAL_ALIAS "*) ;;
            *) echo "CREDENTIAL_ALIAS_CONFIGURATION_FAILURE: unsupported credential alias $CREDENTIAL_ALIAS" >&2; exit 1 ;;
          esac
          set +e
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          api_key = os.environ['OPENROUTER_API_KEY']
          model = os.environ['MODEL']
          reviewer = os.environ['REVIEWER']
          packet = Path('/tmp/review.txt').read_text(encoding='utf-8')
          system = '\n'.join([
              f'You are the independent advisory {reviewer} reviewer for the TeamAi repository.',
              'The packet contains exact-head execution evidence, governing documents and applicable Skills, owning Issue state, the current Tree Census, and the PR diff.',
              'The workflow has already blocked invocation until every required substantive exact-head check completed successfully.',
              'Review repository truth, product logic, governing rules, documentation, Issue state, execution evidence, and changed code.',
              'Authority order: Product Law -> Masterplan -> POLICY/ORUCAVEAM -> Skill wiring -> applicable Skills -> Issue -> PR.',
              'Never invent requirements or recommend weakening governance or validators.',
              'Never treat a PR claim as execution proof when the packet disagrees.',
              'Never treat an open Issue as resolved merely because a PR satisfies one slice. Report the actual Issue state and checklist/completion evidence present in the packet.',
              'Skipped, stale, unrelated, or head-mismatched checks are not passing evidence.',
              'A passing validator proves only the contract it exercises. Distinguish implemented, verified, runtime-proven, completed, and accepted.',
              'If material execution, governance, applicable-Skill, census, or Issue context is missing or truncated, use ADVISORY_ONLY instead of APPROVE.',
              '',
              'Return one JSON object only. Do not expose hidden reasoning, internal deliberation, or repeated self-corrections.',
              'The JSON verdict field must be one of APPROVE, CHANGES_REQUESTED, or ADVISORY_ONLY.',
              'blocking_findings, governance_and_evidence, verification_gaps, non_blocking_observations, and review_basis must each be arrays of at most 5 concise strings.',
              'Use an empty array when a findings/evidence field has no entries.',
              'Use the response_format schema exactly; do not return Markdown headings or any content outside the JSON object.'
          ])
          payload = {
              'model': model,
              'messages': [
                  {'role': 'system', 'content': system},
                  {'role': 'user', 'content': 'Repository PR verification packet:\n\n' + packet},
              ],
              'temperature': 0.1,
              'max_tokens': 4000,
              'provider': {'require_parameters': True},
              'plugins': [{'id': 'response-healing'}],
              'stream': False,
              'response_format': {
                  'type': 'json_schema',
                  'json_schema': {
                      'name': 'teamai_advisory_review',
                      'strict': True,
                      'schema': {
                          'type': 'object',
                          'additionalProperties': False,
                          'properties': {
                              'verdict': {'type': 'string', 'enum': ['APPROVE', 'CHANGES_REQUESTED', 'ADVISORY_ONLY']},
                              'blocking_findings': {'type': 'array', 'items': {'type': 'string'}, 'maxItems': 5},
                              'governance_and_evidence': {'type': 'array', 'items': {'type': 'string'}, 'maxItems': 5},
                              'verification_gaps': {'type': 'array', 'items': {'type': 'string'}, 'maxItems': 5},
                              'non_blocking_observations': {'type': 'array', 'items': {'type': 'string'}, 'maxItems': 5},
                              'review_basis': {'type': 'array', 'items': {'type': 'string'}, 'maxItems': 5},
                          },
                          'required': ['verdict', 'blocking_findings', 'governance_and_evidence', 'verification_gaps', 'non_blocking_observations', 'review_basis'],
                      },
                  },
              },
          }
          body = json.dumps(payload).encode('utf-8')
          Path('/tmp/payload.json').write_bytes(body)
          Path('/tmp/review.md').unlink(missing_ok=True)

          max_attempts = 1 if os.environ.get('INVOCATION_CLASS') == 'automatic' else 3

          for attempt in range(1, max_attempts + 1):
              request = urllib.request.Request(
                  'https://openrouter.ai/api/v1/chat/completions',
                  data=body,
                  method='POST',
              )
              request.add_header('Authorization', f'Bearer {api_key}')
              request.add_header('Content-Type', 'application/json')
              request.add_header('X-OpenRouter-Metadata', 'enabled')
              request.add_header('HTTP-Referer', 'https://github.com/' + os.environ.get('GITHUB_REPOSITORY', 'RbrtMrlsIII/TeamAi'))
              request.add_header('X-Title', f'TeamAi {reviewer} Advisory Review')

              status = None
              raw = b''
              headers = {}
              try:
                  Path('/tmp/provider-attempted.json').write_text(json.dumps({
                      'attempt': attempt,
                      'requested_model': model,
                  }, sort_keys=True), encoding='utf-8')
                  with urllib.request.urlopen(request, timeout=180) as response:
                      status = int(response.status)
                      raw = response.read()
                      headers = dict(response.headers.items())
              except urllib.error.HTTPError as exc:
                  status = int(exc.code)
                  raw = exc.read()
                  headers = dict(exc.headers.items()) if exc.headers else {}
              except (urllib.error.URLError, TimeoutError) as exc:
                  reason = f'PROVIDER_TRANSPORT_FAILURE: {exc.__class__.__name__}: {exc}'
                  Path('/tmp/provider-failure.txt').write_text(reason[:1200], encoding='utf-8')
                  print(f'{reviewer} provider transport failure: {exc.__class__.__name__}: {exc}; attempt={attempt}', file=sys.stderr)
                  if attempt < max_attempts:
                      time.sleep(attempt * 4)
                      continue
                  break

              request_id = headers.get('x-request-id') or headers.get('x-openrouter-request-id') or 'unreported'
              print(f'{reviewer} provider response: http_status={status} attempt={attempt} request_id={request_id}', file=sys.stderr)
              Path('/tmp/response.json').write_bytes(raw)

              try:
                  data = json.loads(raw.decode('utf-8')) if raw else {}
              except (UnicodeDecodeError, json.JSONDecodeError):
                  data = {}

              if status is not None and 200 <= status < 300:
                  choices = data.get('choices') or [] if isinstance(data, dict) else []
                  message = choices[0].get('message') if choices and isinstance(choices[0], dict) else {}
                  metadata = data.get('openrouter_metadata') if isinstance(data, dict) else {}
                  endpoints = metadata.get('endpoints') if isinstance(metadata, dict) else {}
                  available = endpoints.get('available') if isinstance(endpoints, dict) else []
                  selected = next((item for item in (available or []) if isinstance(item, dict) and item.get('selected') is True), {})
                  actual_model = data.get('model') if isinstance(data, dict) else None
                  actual_provider = selected.get('provider') if isinstance(selected, dict) else None
                  Path('/tmp/provider-runtime.json').write_text(json.dumps({
                      'requested_model': model,
                      'actual_model': actual_model,
                      'actual_provider': actual_provider if isinstance(actual_provider, str) and actual_provider else 'unreported',
                      'request_id': request_id,
                      'routing_metadata': 'enabled',
                  }, sort_keys=True), encoding='utf-8')

                  if not isinstance(actual_model, str) or not actual_model or actual_model == model:
                      reason = f'ROUTER_PROVENANCE_FAILURE: response model did not expose a routed model distinct from requested route {model}.'
                      Path('/tmp/provider-failure.txt').write_text(reason, encoding='utf-8')
                      print(reason, file=sys.stderr)
                      sys.exit(1)

                  content = message.get('content') if isinstance(message, dict) else None
                  if isinstance(content, list):
                      content = '\n'.join(item.get('text', '') for item in content if isinstance(item, dict) and isinstance(item.get('text'), str))
                  response_shape = {
                      'choices_count': len(choices),
                      'message_keys': sorted(message.keys()) if isinstance(message, dict) else [],
                      'finish_reason': choices[0].get('finish_reason') if choices and isinstance(choices[0], dict) else None,
                      'content_present': isinstance(content, str) and bool(content.strip()),
                      'content_chars': len(content) if isinstance(content, str) else 0,
                      'reasoning_chars': len(message.get('reasoning')) if isinstance(message, dict) and isinstance(message.get('reasoning'), str) else 0,
                      'refusal_present': bool(message.get('refusal')) if isinstance(message, dict) else False,
                      'tool_calls_present': bool(message.get('tool_calls')) if isinstance(message, dict) else False,
                  }
                  usage = data.get('usage') if isinstance(data, dict) and isinstance(data.get('usage'), dict) else {}
                  completion_details = usage.get('completion_tokens_details') if isinstance(usage.get('completion_tokens_details'), dict) else {}
                  usage_summary = {
                      'prompt_tokens': usage.get('prompt_tokens') if isinstance(usage.get('prompt_tokens'), int) else None,
                      'completion_tokens': usage.get('completion_tokens') if isinstance(usage.get('completion_tokens'), int) else None,
                      'total_tokens': usage.get('total_tokens') if isinstance(usage.get('total_tokens'), int) else None,
                      'reasoning_tokens': completion_details.get('reasoning_tokens') if isinstance(completion_details.get('reasoning_tokens'), int) else (usage.get('reasoning_tokens') if isinstance(usage.get('reasoning_tokens'), int) else None),
                  }
                  runtime_path = Path('/tmp/provider-runtime.json')
                  runtime = json.loads(runtime_path.read_text(encoding='utf-8')) if runtime_path.exists() else {}
                  runtime['response_shape'] = response_shape
                  runtime['usage_summary'] = usage_summary
                  runtime_path.write_text(json.dumps(runtime, sort_keys=True), encoding='utf-8')
                  if not isinstance(content, str) or not content.strip():
                      response_keys = ','.join(sorted(data.keys())) if isinstance(data, dict) else 'non-object'
                      finish_reason = choices[0].get('finish_reason') if choices and isinstance(choices[0], dict) else None
                      if finish_reason == 'length':
                          reason = f'PROVIDER_RESPONSE_TRUNCATED: HTTP {status} reached finish_reason=length before usable review content was produced; response_keys={response_keys}.'
                      else:
                          reason = f'PROVIDER_RESPONSE_FAILURE: HTTP {status} returned no usable review content; response_keys={response_keys}.'
                      Path('/tmp/provider-failure.txt').write_text(reason, encoding='utf-8')
                      print(f'{reviewer} {reason}', file=sys.stderr)
                      sys.exit(1)

                  try:
                      structured = json.loads(content)
                      if not isinstance(structured, dict):
                          raise ValueError('structured review root must be an object')
                  except (TypeError, json.JSONDecodeError, ValueError) as exc:
                      reason = f'INVALID_REVIEW_FORMAT: response was not valid JSON matching the advisory review contract: {exc}'
                      Path('/tmp/provider-failure.txt').write_text(reason, encoding='utf-8')
                      print(f'{reviewer} {reason}', file=sys.stderr)
                      sys.exit(1)

                  allowed_verdicts = {'APPROVE', 'CHANGES_REQUESTED', 'ADVISORY_ONLY'}
                  fields = ['blocking_findings', 'governance_and_evidence', 'verification_gaps', 'non_blocking_observations', 'review_basis']
                  verdict = structured.get('verdict')
                  if verdict not in allowed_verdicts:
                      reason = 'INVALID_REVIEW_FORMAT: structured verdict is missing or invalid.'
                      Path('/tmp/provider-failure.txt').write_text(reason, encoding='utf-8')
                      print(f'{reviewer} {reason}', file=sys.stderr)
                      sys.exit(1)
                  for field in fields:
                      value = structured.get(field)
                      if not isinstance(value, list) or len(value) > 5 or not all(isinstance(item, str) for item in value):
                          reason = f'INVALID_REVIEW_FORMAT: field {field} must be an array of at most 5 strings.'
                          Path('/tmp/provider-failure.txt').write_text(reason, encoding='utf-8')
                          print(f'{reviewer} {reason}', file=sys.stderr)
                          sys.exit(1)

                  def compact_items(items):
                      clean = [item.strip() for item in items if item.strip()]
                      if not clean:
                          return 'None stated.'
                      text = '\n'.join(f'- {item}' for item in clean)
                      text = re.sub(r'\n{3,}', '\n\n', text)
                      return text[:2000].rstrip() + ('...' if len(text) > 2000 else '')

                  normalized = '\n\n'.join([
                      f'## Verdict\n{verdict}',
                      f'## Blocking findings\n{compact_items(structured["blocking_findings"])}',
                      f'## Governance and evidence\n{compact_items(structured["governance_and_evidence"])}',
                      f'## Verification gaps\n{compact_items(structured["verification_gaps"])}',
                      f'## Non-blocking observations\n{compact_items(structured["non_blocking_observations"])}',
                      f'## Review basis\n{compact_items(structured["review_basis"])}',
                  ])
                  if len(normalized) > int(os.environ.get('MAX_REVIEW_CHARS', '12000')):
                      normalized = normalized[:int(os.environ.get('MAX_REVIEW_CHARS', '12000'))].rstrip() + '\n\n[review output bounded by TeamAi reviewer contract]'
                  Path('/tmp/review.md').write_text(normalized, encoding='utf-8')
                  sys.exit(0)
              else:
                  error = data.get('error') if isinstance(data, dict) else None
                  error = error if isinstance(error, dict) else {}
                  diagnostic = {
                      'error_code': error.get('code'),
                      'error_type': error.get('type'),
                      'error_message': error.get('message') or (data.get('message') if isinstance(data, dict) else None),
                      'provider': ((error.get('metadata') or {}).get('provider_name') if isinstance(error.get('metadata'), dict) else None),
                  }
                  reason = f'PROVIDER_HTTP_FAILURE: HTTP {status}; {json.dumps(diagnostic, sort_keys=True)}'
                  Path('/tmp/provider-failure.txt').write_text(reason[:1600], encoding='utf-8')
                  print(f'{reviewer} provider diagnostic: {json.dumps(diagnostic, sort_keys=True)}', file=sys.stderr)

              if attempt < max_attempts:
                  time.sleep(attempt * 4)

          if not Path('/tmp/provider-failure.txt').exists():
              Path('/tmp/provider-failure.txt').write_text(
                  f'PROVIDER_REQUEST_FAILURE: review request failed after {max_attempts} provider attempt(s).',
                  encoding='utf-8',
              )
          print(f'{reviewer} review request failed after {max_attempts} provider attempt(s). No review was posted.', file=sys.stderr)
          sys.exit(1)
          PY
          python_rc=$?
          set -e
          if [[ "$INVOCATION_CLASS" == "automatic" ]]; then
            if [[ "$python_rc" -eq 0 && -s /tmp/review.md ]]; then
              echo 'review_ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -f /tmp/provider-failure.txt ]]; then
              echo 'review_ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "AUTOMATIC_PROVIDER_STEP_FAILURE: reviewer runner exited $python_rc without a classified provider failure." >&2
            exit "$python_rc"
          fi
          exit "$python_rc"

      - name: Post advisory review
        id: post_review
        if: inputs.invocation_class != 'automatic' || steps.invoke_model.outputs.review_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.meta.outputs.head }}
          REVIEWER: ${{ inputs.reviewer }}
          MODEL: openrouter/free
          CREDENTIAL_ALIAS: ${{ inputs.credential_alias }}
          INVOCATION: ${{ inputs.invocation_class }}
          AUTO_MARKER: ${{ inputs.automatic_marker }}
          MANUAL_MARKER: ${{ inputs.manual_marker }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/provider-runtime.json
          actual_model="$(jq -r '.actual_model' /tmp/provider-runtime.json)"
          actual_provider="$(jq -r '.actual_provider' /tmp/provider-runtime.json)"
          request_id="$(jq -r '.request_id' /tmp/provider-runtime.json)"
          test -n "$actual_model"
          test "$actual_model" != "$MODEL"
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          [[ "$current_head" == "$HEAD" ]] || {
            echo "Exact-head guard failed while posting review: $current_head != $HEAD."
            exit 1
          }
          marker="$MANUAL_MARKER"
          if [[ "$INVOCATION" == "automatic" ]]; then marker="$AUTO_MARKER"; fi
          {
            echo "$marker"
            echo "# $REVIEWER Advisory Review"
            echo
            printf 'Requested route: `%s`\n' "$MODEL"
            printf 'Actual model: `%s`\n' "$actual_model"
            printf 'Actual provider: `%s`\n' "$actual_provider"
            printf 'OpenRouter request id: `%s`\n' "$request_id"
            printf 'Exact PR head: `%s`\n' "$HEAD"
            echo "Invocation class: $INVOCATION"
            printf 'Credential alias: `%s`\n' "$CREDENTIAL_ALIAS"
            if [[ "$INVOCATION" == "automatic" ]]; then echo 'Slot outcome: SUCCEEDED'; fi
            echo 'Execution gate: required substantive exact-head checks passed before model invocation.'
            echo
            cat /tmp/review.md
          } > /tmp/comment.md
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$(cat /tmp/comment.md)" >/dev/null

      - name: Write terminal automatic slot artifact
        if: always() && inputs.invocation_class == 'automatic'
        env:
          HEAD: ${{ inputs.expected_head }}
          REVIEWER: ${{ inputs.reviewer }}
          REVIEWER_SLUG: ${{ inputs.reviewer_slug }}
          CREDENTIAL_ALIAS: ${{ inputs.credential_alias }}
          INVOKE_OUTCOME: ${{ steps.invoke_model.outcome }}
          POST_OUTCOME: ${{ steps.post_review.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          attempted = Path('/tmp/provider-attempted.json').exists()
          runtime_path = Path('/tmp/provider-runtime.json')
          runtime = json.loads(runtime_path.read_text(encoding='utf-8')) if runtime_path.exists() else {}
          failure_path = Path('/tmp/provider-failure.txt')
          diagnostic = failure_path.read_text(encoding='utf-8').strip() if failure_path.exists() else ''
          invoke = os.environ.get('INVOKE_OUTCOME', '')
          post = os.environ.get('POST_OUTCOME', '')

          if runtime and post == 'success' and not failure_path.exists():
              outcome = 'SUCCEEDED'
          elif failure_path.exists():
              outcome = 'PROVIDER_FAILED'
          elif runtime:
              outcome = 'REVIEW_POST_FAILED'
              diagnostic = diagnostic or 'Provider response was validated, but the advisory review could not be posted.'
          elif attempted:
              outcome = 'PROVIDER_FAILED'
          else:
              outcome = 'PRE_PROVIDER_FAILURE'
              diagnostic = diagnostic or ('Provider invocation was not reached; review step outcome=' + (invoke or 'not-started'))

          tail = os.environ['REVIEWER_SLUG'].rsplit('-', 1)[-1]
          if not tail.isdigit():
              raise SystemExit('Invalid reviewer slug; terminal slot artifact cannot be assigned.')
          record = {
              'schema_version': 1,
              'slot': int(tail),
              'reviewer': os.environ['REVIEWER'],
              'reviewer_slug': os.environ['REVIEWER_SLUG'],
              'credential_alias': os.environ['CREDENTIAL_ALIAS'],
              'expected_head': os.environ.get('HEAD', ''),
              'requested_route': 'openrouter/free',
              'actual_model': runtime.get('actual_model'),
              'actual_provider': runtime.get('actual_provider'),
              'request_id': runtime.get('request_id'),
              'outcome': outcome,
              'provider_invocation_attempted': attempted,
              'review_published': post == 'success',
              'response_shape': runtime.get('response_shape'),
              'usage_summary': runtime.get('usage_summary'),
              'diagnostic': diagnostic[:2000],
          }
          Path('/tmp/slot-result.json').write_text(
              json.dumps(record, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload terminal automatic slot artifact
        if: always() && inputs.invocation_class == 'automatic'
        uses: actions/upload-artifact@v4
        with:
          name: teamai-advisory-slot-${{ inputs.reviewer_slug }}
          path: /tmp/slot-result.json
          if-no-files-found: error
          retention-days: 14
