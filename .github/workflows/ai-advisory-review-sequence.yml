name: AI Advisory Review Sequence

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-review-sequence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VALIDATION_POLL_SECONDS: '15'
  VALIDATION_TIMEOUT_SECONDS: '1800'
  SEQUENCE_MARKER: '<!-- teamai-ai-review-sequence-auto -->'
  SEQUENCE_COMPLETE_MARKER: '<!-- teamai-ai-review-sequence-complete -->'

jobs:
  eligibility:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate one quota-safe automatic review sequence per PR
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MARKER: ${{ env.SEQUENCE_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"

          if jq -e --arg marker "$SEQUENCE_COMPLETE_MARKER" --arg head "$HEAD" 'any(.[]; (.user.login == "github-actions[bot]") and ((.body // "") | contains($marker) and contains(("Exact PR head: " + $head))))' <<< "$comments" >/dev/null; then
            echo "Execution-complete marker already exists for exact head $HEAD."
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e --arg marker "$MARKER" --arg head "$HEAD" 'any(.[]; (.user.login == "github-actions[bot]") and ((.body // "") | contains($marker) and contains(("Exact PR head: " + $head))))' <<< "$comments" >/dev/null; then
            echo "An automatic sequence claim already exists for PR #$PR on this exact head. The five-call quota is frozen and this head must not restart it."
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'should_run=true' >> "$GITHUB_OUTPUT"
          echo "PR #$PR is eligible for one quota-safe five-slot OpenRouter Free advisory sequence on exact head $HEAD."

  validation_gate:
    needs: eligibility
    if: needs.eligibility.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Wait for required substantive validation to finish before sequence claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          POLL_SECONDS: ${{ env.VALIDATION_POLL_SECONDS }}
          TIMEOUT_SECONDS: ${{ env.VALIDATION_TIMEOUT_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "governance-drift"
            "evidence-consistency"
            "agent-validation"
            "Recovery integrity"
            "Project tests + canonical package"
            "Playwright browser verification"
          )
          if [[ "$GITHUB_BASE_REF" == "main" ]]; then
            required+=("CodeQL analyze (javascript-typescript)")
          fi
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          while true; do
            current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            draft_state="$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')"
            if [[ "$current_head" != "$HEAD" ]]; then
              echo "PR head changed during validation gate: expected $HEAD, found $current_head."
              exit 1
            fi
            if [[ "$draft_state" != "false" ]]; then
              echo "PR is no longer non-draft during validation gate; automatic reviewer sequence will not start."
              exit 1
            fi
            checks="$(gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100")"
            pending=0
            failed=0
            missing=0
            for name in "${required[@]}"; do
              check="$(jq -c --arg name "$name" --arg head "$HEAD" '[.check_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.started_at // .created_at) | last // empty' <<< "$checks")"
              if [[ -z "$check" ]]; then
                echo "$name: status=MISSING conclusion=MISSING"
                missing=$((missing + 1))
                continue
              fi
              status="$(jq -r '.status' <<< "$check")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$check")"
              echo "$name: status=$status conclusion=${conclusion:-PENDING}"
              if [[ "$status" != "completed" ]]; then
                pending=$((pending + 1))
              elif [[ "$conclusion" != "success" ]]; then
                failed=$((failed + 1))
              fi
            done
            if (( failed > 0 )); then
              echo "Required substantive validation failed. Automatic reviewer sequence will not start."
              exit 1
            fi
            if (( missing == 0 && pending == 0 )); then
              echo "All required substantive validators passed on exact head $HEAD."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for required substantive validators on exact head $HEAD."
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

  claim:
    needs: [eligibility, validation_gate]
    if: needs.eligibility.outputs.should_run == 'true' && needs.validation_gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - name: Claim the automatic five-slot sequence only after validations pass
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MARKER: ${{ env.SEQUENCE_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          if [[ "$current_head" != "$HEAD" ]]; then
            echo "Head changed before sequence claim: expected $HEAD, found $current_head."
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"
          if jq -e --arg marker "$MARKER" --arg head "$HEAD" 'any(.[]; ((.body // "") | contains($marker) and contains(("Exact PR head: " + $head))))' <<< "$comments" >/dev/null; then
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            echo "A durable automatic sequence claim already exists for exact head $HEAD; no second sequence is permitted on the same head."
            exit 0
          fi
          body="$(printf '%s\n\n%s\n%s\n%s\n%s\n%s' "$MARKER" '# Automatic OpenRouter Free Advisory Review Sequence' "Exact PR head: $HEAD" 'Routing: five parallel OpenRouter Free Router slots; every slot requests openrouter/free and receives its own OpenRouter credential alias.' 'State: CLAIMED' 'Provider budget: maximum 5 automatic OpenRouter HTTP requests per exact PR head, one request per distinct credential slot; no inter-slot interval or staged barrier is used.')"
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

  openrouter_free:
    needs: claim
    if: needs.claim.outputs.claimed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: 1
            credential_alias: OPENROUTER_API_KEY
          - slot: 2
            credential_alias: OPENROUTER_API_KEY_OPENAI
          - slot: 3
            credential_alias: OPENROUTER_API_KEY_POOLSIDE
          - slot: 4
            credential_alias: OPENROUTER_API_KEY_DEEPSEEK
          - slot: 5
            credential_alias: OPENROUTER_API_KEY_GWEN
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: OpenRouter Free Slot ${{ matrix.slot }}
      reviewer_slug: openrouter-free-${{ matrix.slot }}
      credential_alias: ${{ matrix.credential_alias }}
      pr_number: ${{ github.event.pull_request.number }}
      expected_head: ${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-openrouter-free-slot-${{ matrix.slot }}-auto-review -->'
      manual_marker: '<!-- teamai-openrouter-free-slot-${{ matrix.slot }}-manual-review -->'
      automatic_outcome_marker: '<!-- teamai-openrouter-free-slot-${{ matrix.slot }}-outcome -->'
    secrets:
      api_key: ${{ secrets[matrix.credential_alias] }}

  sequence_complete:
    needs: [claim, openrouter_free]
    if: always() && needs.claim.result == 'success' && needs.claim.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Verify five terminal automatic router slot outcomes on the exact sequence head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          COMPLETE_MARKER: ${{ env.SEQUENCE_COMPLETE_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          [[ "$current_head" == "$HEAD" ]] || {
            echo "PR head changed before execution-complete check: $current_head != $HEAD."
            exit 1
          }

          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"
          jobs="$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"

          success_count=0
          failure_count=0
          missing=0

          for slot in 1 2 3 4 5; do
            outcome_marker="<!-- teamai-openrouter-free-slot-$slot-outcome -->"
            review_marker="<!-- teamai-openrouter-free-slot-$slot-auto-review -->"
            case "$slot" in
              1) expected_credential_alias="OPENROUTER_API_KEY" ;;
              2) expected_credential_alias="OPENROUTER_API_KEY_OPENAI" ;;
              3) expected_credential_alias="OPENROUTER_API_KEY_POOLSIDE" ;;
              4) expected_credential_alias="OPENROUTER_API_KEY_DEEPSEEK" ;;
              5) expected_credential_alias="OPENROUTER_API_KEY_GWEN" ;;
              *) echo "MISMATCH: unknown slot $slot"; missing=$((missing + 1)); continue ;;
            esac
            job_name="openrouter_free ($slot, $expected_credential_alias) / review"
            job="$(jq -c --arg name "$job_name" '[.jobs[] | select(.name == $name)] | last // empty' <<< "$jobs")"

            if [[ -z "$job" ]]; then
              echo "MISSING: slot $slot Actions job was not found."
              missing=$((missing + 1))
              continue
            fi

            status="$(jq -r '.status' <<< "$job")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$job")"
            echo "Slot $slot: status=$status conclusion=${conclusion:-PENDING}"

            if [[ "$status" != "completed" || ( "$conclusion" != "success" && "$conclusion" != "failure" ) ]]; then
              echo "INCOMPLETE: slot $slot is not in an allowed terminal execution result."
              missing=$((missing + 1))
              continue
            fi

            outcome="$(jq -r --arg marker "$outcome_marker" --arg head "$HEAD" 'first(.[] | select(.user.login == "github-actions[bot]") | select((.body // "") | contains($marker) and contains(("Exact PR head: " + $head)))) | .body // empty' <<< "$comments")"
            if [[ -z "$outcome" ]]; then
              echo "MISSING: slot $slot durable outcome is absent for exact head $HEAD."
              missing=$((missing + 1))
              continue
            fi

            outcome_state="$(sed -n 's/^Slot outcome: //p' <<< "$outcome" | head -1)"
            case "$outcome_state" in
              SUCCEEDED|PROVIDER_FAILED|REVIEW_POST_FAILED|PRE_PROVIDER_FAILURE)
                ;;
              *)
                echo "MISMATCH: slot $slot outcome marker has an unrecognized terminal state: ${outcome_state:-<missing>}"
                missing=$((missing + 1))
                continue
                ;;
            esac
            expected_credential_line='Credential alias: `'"$expected_credential_alias"'`'
            grep -Fq "$expected_credential_line" <<< "$outcome" || {
              echo "MISMATCH: slot $slot outcome is not bound to expected credential alias $expected_credential_alias."
              missing=$((missing + 1))
              continue
            }

            expected_slug='Reviewer slug: `openrouter-free-'"$slot"'`'
            grep -Fq "$expected_slug" <<< "$outcome" || {
              echo "MISMATCH: slot $slot outcome marker identifies a different reviewer slug."
              missing=$((missing + 1))
              continue
            }

            if [[ "$conclusion" == "success" ]]; then
              if [[ "$outcome_state" != "SUCCEEDED" ]]; then
                echo "MISMATCH: successful slot $slot workflow job must publish Slot outcome: SUCCEEDED, found $outcome_state."
                missing=$((missing + 1))
                continue
              fi
              if ! jq -e --arg marker "$review_marker" --arg head "$HEAD" 'any(.[]; (.user.login == "github-actions[bot]") and ((.body // "") | contains($marker) and contains(("Exact PR head: " + $head))))' <<< "$comments" >/dev/null; then
                echo "MISSING: successful slot $slot has no advisory output for exact head $HEAD."
                missing=$((missing + 1))
                continue
              fi
              success_count=$((success_count + 1))
            else
              if [[ "$outcome_state" == "SUCCEEDED" ]]; then
                echo "MISMATCH: failed slot $slot workflow job cannot publish Slot outcome: SUCCEEDED."
                missing=$((missing + 1))
                continue
              fi
              failure_count=$((failure_count + 1))
            fi
          done

          if (( missing > 0 )); then
            echo "Automatic OpenRouter Free advisory execution is incomplete: $missing slot outcome(s) are missing, mismatched, or not proven on exact head $HEAD."
            exit 1
          fi

          if jq -e --arg marker "$COMPLETE_MARKER" --arg head "$HEAD" 'any(.[]; (.user.login == "github-actions[bot]") and ((.body // "") | contains($marker) and contains(("Exact PR head: " + $head))))' <<< "$comments" >/dev/null; then
            echo "Execution-complete marker already exists for exact head $HEAD."
            exit 0
          fi

          body="$(printf '%s\n\n%s\n%s\n%s\n%s' "$COMPLETE_MARKER" '# Automatic OpenRouter Free Advisory Execution Complete' "Exact PR head: $HEAD" "Five parallel OpenRouter Free Router slots reached terminal execution outcomes: $success_count successful advisory output(s), $failure_count failed slot execution(s)." 'Execution completion is distinct from advisory success. A failed provider call remains durable slot evidence and does not trigger a replacement call, secret substitution, or second automatic sequence.')"
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo "Automatic OpenRouter Free advisory execution is complete for exact head $HEAD: successes=$success_count failures=$failure_count."
