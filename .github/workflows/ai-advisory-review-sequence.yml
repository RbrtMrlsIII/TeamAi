name: AI Advisory Review Sequence

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-review-sequence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REVIEW_INTERVAL_SECONDS: '150'
  VALIDATION_POLL_SECONDS: '15'
  VALIDATION_TIMEOUT_SECONDS: '1800'
  SEQUENCE_MARKER: '<!-- teamai-ai-review-sequence-auto -->'
  NEMOTRON_AUTO_MARKER: '<!-- teamai-nemotron-auto-review -->'
  DEEPSEEK_AUTO_MARKER: '<!-- teamai-deepseek-auto-review -->'
  QWEN_AUTO_MARKER: '<!-- teamai-qwen-auto-review -->'

jobs:
  eligibility:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate one automatic review sequence per PR
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: ${{ env.SEQUENCE_MARKER }}
          LEGACY_NEMOTRON_MARKER: ${{ env.NEMOTRON_AUTO_MARKER }}
          DEEPSEEK_MARKER: ${{ env.DEEPSEEK_AUTO_MARKER }}
          QWEN_MARKER: ${{ env.QWEN_AUTO_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"
          for marker in "$MARKER" "$LEGACY_NEMOTRON_MARKER" "$DEEPSEEK_MARKER" "$QWEN_MARKER"; do
            if jq -e --arg marker "$marker" 'any(.[]; (.body // "") | contains($marker))' <<< "$comments" >/dev/null; then
              echo 'should_run=false' >> "$GITHUB_OUTPUT"
              echo "Automatic AI review sequence already claimed or partially completed for PR #$PR."
              exit 0
            fi
          done
          echo 'should_run=true' >> "$GITHUB_OUTPUT"
          echo "PR #$PR is eligible for its first automatic advisory review sequence."

  validation_gate:
    needs: eligibility
    if: needs.eligibility.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Wait for required substantive validation to finish before sequence claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          POLL_SECONDS: ${{ env.VALIDATION_POLL_SECONDS }}
          TIMEOUT_SECONDS: ${{ env.VALIDATION_TIMEOUT_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "governance-drift"
            "evidence-consistency"
            "agent-validation"
            "Recovery integrity"
            "Project tests + canonical package"
            "CodeQL analyze (javascript-typescript)"
            "Playwright browser verification"
          )
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          while true; do
            current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            if [[ "$current_head" != "$HEAD" ]]; then
              echo "PR head changed during validation gate: expected $HEAD, found $current_head."
              echo "Failing closed; the synchronized head must establish a new deliberate review point."
              exit 1
            fi

            checks="$(gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100")"
            pending=0
            failed=0
            missing=0
            for name in "${required[@]}"; do
              check="$(jq -c --arg name "$name" --arg head "$HEAD" '[.check_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.started_at // .created_at) | last // empty' <<< "$checks")"
              if [[ -z "$check" ]]; then
                echo "$name: status=MISSING conclusion=MISSING"
                missing=$((missing + 1))
                continue
              fi
              status="$(jq -r '.status' <<< "$check")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$check")"
              echo "$name: status=$status conclusion=${conclusion:-PENDING}"
              if [[ "$status" != "completed" ]]; then
                pending=$((pending + 1))
              elif [[ "$conclusion" != "success" ]]; then
                failed=$((failed + 1))
              fi
            done

            if (( failed > 0 )); then
              echo "Required substantive validation failed. Automatic reviewer sequence will not start."
              exit 1
            fi
            if (( missing == 0 && pending == 0 )); then
              echo "All required substantive validators passed on exact head $HEAD."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for required substantive validators on exact head $HEAD."
              exit 1
            fi
            echo "Validation still running or incomplete; polling again in ${POLL_SECONDS}s."
            sleep "$POLL_SECONDS"
          done

  claim:
    needs: [eligibility, validation_gate]
    if: needs.eligibility.outputs.should_run == 'true' && needs.validation_gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - name: Claim the automatic sequence only after validations pass
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MARKER: ${{ env.SEQUENCE_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          if [[ "$current_head" != "$HEAD" ]]; then
            echo "Head changed before sequence claim: expected $HEAD, found $current_head."
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"
          if jq -e --arg marker "$MARKER" 'any(.[]; (.body // "") | contains($marker))' <<< "$comments" >/dev/null; then
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="$(printf '%s\n\n%s\n%s\n%s' "$MARKER" '# Automatic AI Advisory Review Sequence' "Initial exact PR head: \`$HEAD\`" 'Order: Nemotron → 2 minutes 30 seconds → DeepSeek → 2 minutes 30 seconds → Qwen')"
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

  nemotron:
    needs: claim
    if: needs.claim.outputs.claimed == 'true'
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Nemotron
      reviewer_slug: nemotron
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      pr_number: ${{ github.event.pull_request.number }}
      expected_head: ${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-nemotron-auto-review -->'
      manual_marker: '<!-- teamai-nemotron-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY }}

  delay_to_deepseek:
    needs: nemotron
    if: needs.nemotron.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait 2 minutes 30 seconds before DeepSeek
        run: sleep "${REVIEW_INTERVAL_SECONDS}"

  deepseek:
    needs: delay_to_deepseek
    if: needs.delay_to_deepseek.result == 'success'
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: DeepSeek
      reviewer_slug: deepseek
      model: deepseek/deepseek-v4.1-flash
      pr_number: ${{ github.event.pull_request.number }}
      expected_head: ${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-deepseek-auto-review -->'
      manual_marker: '<!-- teamai-deepseek-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_DEEPSEEK }}

  delay_to_qwen:
    needs: deepseek
    if: needs.deepseek.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait 2 minutes 30 seconds before Qwen
        run: sleep "${REVIEW_INTERVAL_SECONDS}"

  qwen:
    needs: delay_to_qwen
    if: needs.delay_to_qwen.result == 'success'
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Qwen
      reviewer_slug: qwen
      model: qwen/qwen3.8-max-0902
      pr_number: ${{ github.event.pull_request.number }}
      expected_head: ${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-qwen-auto-review -->'
      manual_marker: '<!-- teamai-qwen-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_GWEN }}
