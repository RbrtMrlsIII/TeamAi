name: AI Advisory Review Sequence

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-review-sequence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REVIEW_INTERVAL_SECONDS: '150'
  VALIDATION_POLL_SECONDS: '15'
  VALIDATION_TIMEOUT_SECONDS: '1800'
  SEQUENCE_MARKER: '<!-- teamai-ai-review-sequence-auto -->'
  SEQUENCE_COMPLETE_MARKER: '<!-- teamai-ai-review-sequence-complete -->'
  PROVIDER_STARTED_MARKER: '<!-- teamai-ai-review-provider-started -->'
  NEMOTRON_AUTO_MARKER: '<!-- teamai-nemotron-ultra-auto-review -->'
  LING_AUTO_MARKER: '<!-- teamai-ling-auto-review -->'
  POOLSIDE_AUTO_MARKER: '<!-- teamai-poolside-auto-review -->'
  LAGUNA_AUTO_MARKER: '<!-- teamai-laguna-auto-review -->'
  DOTS3_AUTO_MARKER: '<!-- teamai-dots3-auto-review -->'

jobs:
  eligibility:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate one quota-safe automatic review sequence per PR
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MARKER: ${{ env.SEQUENCE_MARKER }}
          COMPLETE_MARKER: ${{ env.SEQUENCE_COMPLETE_MARKER }}
          PROVIDER_STARTED_MARKER: ${{ env.PROVIDER_STARTED_MARKER }}
          NEMOTRON_MARKER: ${{ env.NEMOTRON_AUTO_MARKER }}
          LING_MARKER: ${{ env.LING_AUTO_MARKER }}
          POOLSIDE_MARKER: ${{ env.POOLSIDE_AUTO_MARKER }}
          LAGUNA_MARKER: ${{ env.LAGUNA_AUTO_MARKER }}
          DOTS3_MARKER: ${{ env.DOTS3_AUTO_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"

          complete=true
          for marker in "$NEMOTRON_MARKER" "$LING_MARKER" "$POOLSIDE_MARKER" "$LAGUNA_MARKER" "$DOTS3_MARKER"; do
            if ! jq -e --arg marker "$marker" --arg head "$HEAD" 'any(.[]; ((.body // "") | contains($marker) and contains(("Exact PR head: `" + $head + "`"))))' <<< "$comments" >/dev/null; then
              complete=false
              break
            fi
          done
          if [[ "$complete" == "true" ]]; then
            echo "All five automatic reviewer outputs are recorded on exact head $HEAD; sequence is complete for this PR."
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e --arg marker "$PROVIDER_STARTED_MARKER" 'any(.[]; (.body // "") | contains($marker))' <<< "$comments" >/dev/null; then
            echo "An automatic provider slot has already been reserved for PR #$PR. The five-call budget is now frozen; no automatic recovery is permitted."
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e --arg marker "$MARKER" --arg head "$HEAD" 'any(.[]; ((.body // "") | contains($marker) and contains(("Exact PR head: `" + $head + "`"))))' <<< "$comments" >/dev/null; then
            echo "An automatic sequence claim already exists for exact head $HEAD and no provider slot has started yet; this concurrent invocation must not duplicate it."
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'should_run=true' >> "$GITHUB_OUTPUT"
          echo "PR #$PR is eligible for a quota-safe automatic advisory review sequence on exact head $HEAD."

  validation_gate:
    needs: eligibility
    if: needs.eligibility.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Wait for required substantive validation to finish before sequence claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          POLL_SECONDS: ${{ env.VALIDATION_POLL_SECONDS }}
          TIMEOUT_SECONDS: ${{ env.VALIDATION_TIMEOUT_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "governance-drift"
            "evidence-consistency"
            "agent-validation"
            "Recovery integrity"
            "Project tests + canonical package"
            "Playwright browser verification"
          )
          # CodeQL is configured only for pull requests targeting main. Stacked
          # governance PRs intentionally target the governance branch, so a
          # missing CodeQL check there must not deadlock the advisory sequence.
          if [[ "$GITHUB_BASE_REF" == "main" ]]; then
            required+=("CodeQL analyze (javascript-typescript)")
          fi
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          while true; do
            current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            draft_state="$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')"
            if [[ "$current_head" != "$HEAD" ]]; then
              echo "PR head changed during validation gate: expected $HEAD, found $current_head."
              exit 1
            fi
            if [[ "$draft_state" != "false" ]]; then
              echo "PR is no longer non-draft during validation gate; automatic reviewer sequence will not start."
              exit 1
            fi
            checks="$(gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100")"
            pending=0
            failed=0
            missing=0
            for name in "${required[@]}"; do
              check="$(jq -c --arg name "$name" --arg head "$HEAD" '[.check_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.started_at // .created_at) | last // empty' <<< "$checks")"
              if [[ -z "$check" ]]; then
                echo "$name: status=MISSING conclusion=MISSING"
                missing=$((missing + 1))
                continue
              fi
              status="$(jq -r '.status' <<< "$check")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$check")"
              echo "$name: status=$status conclusion=${conclusion:-PENDING}"
              if [[ "$status" != "completed" ]]; then
                pending=$((pending + 1))
              elif [[ "$conclusion" != "success" ]]; then
                failed=$((failed + 1))
              fi
            done
            if (( failed > 0 )); then
              echo "Required substantive validation failed. Automatic reviewer sequence will not start."
              exit 1
            fi
            if (( missing == 0 && pending == 0 )); then
              echo "All required substantive validators passed on exact head $HEAD."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for required substantive validators on exact head $HEAD."
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

  claim:
    needs: [eligibility, validation_gate]
    if: needs.eligibility.outputs.should_run == 'true' && needs.validation_gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - name: Claim the automatic sequence only after validations pass
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MARKER: ${{ env.SEQUENCE_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          if [[ "$current_head" != "$HEAD" ]]; then
            echo "Head changed before sequence claim: expected $HEAD, found $current_head."
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"
          if jq -e --arg marker "$PROVIDER_STARTED_MARKER" 'any(.[]; (.body // "") | contains($marker))' <<< "$comments" >/dev/null; then
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            echo 'Provider invocation state already exists; automatic sequence budget is frozen.'
            exit 0
          fi
          if jq -e --arg marker "$MARKER" --arg head "$HEAD" 'any(.[]; ((.body // "") | contains($marker) and contains(("Exact PR head: `" + $head + "`"))))' <<< "$comments" >/dev/null; then
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            echo 'A current-head sequence claim already exists.'
            exit 0
          fi
          body="$(printf '%s\n\n%s\n%s\n%s\n%s' "$MARKER" '# Automatic AI Advisory Review Sequence' "Exact PR head: \`$HEAD\`" 'Order: Nemotron Ultra → 2 minutes 30 seconds → Ling 3.0 Flash + Poolside → 2 minutes 30 seconds → Laguna + Dots3-Note Preview' 'State: CLAIMED' 'Provider budget: maximum 5 automatic OpenRouter HTTP requests; budget remains unused until a reviewer slot is reserved.')"
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

  nemotron:
    needs: claim
    if: needs.claim.outputs.claimed == 'true'
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Nemotron Ultra
      reviewer_slug: nemotron-ultra
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      pr_number: ${{ github.event.pull_request.number }}
      expected_head: ${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-nemotron-ultra-auto-review -->'
      manual_marker: '<!-- teamai-nemotron-ultra-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY }}

  delay_to_second_stage:
    needs: nemotron
    if: always() && (needs.nemotron.result == 'success' || needs.nemotron.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reconfirm exact head before starting the stage-1 barrier
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          [[ "$current_head" == "$HEAD" ]] || {
            echo "PR head changed before stage-1 interval: expected $HEAD, found $current_head."
            exit 1
          }
          draft_state="$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')"
          [[ "$draft_state" == "false" ]] || {
            echo "PR became draft before stage-1 interval; later automatic stages are blocked."
            exit 1
          }

      - name: Wait 2 minutes 30 seconds after Nemotron Ultra turn
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sleep "$REVIEW_INTERVAL_SECONDS"
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          [[ "$current_head" == "$HEAD" ]] || {
            echo "PR head changed during stage-1 interval: expected $HEAD, found $current_head."
            exit 1
          }
          draft_state="$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')"
          [[ "$draft_state" == "false" ]] || {
            echo "PR became draft during stage-1 interval; later automatic stages are blocked."
            exit 1
          }

  ling:
    needs: delay_to_second_stage
    if: always() && needs.delay_to_second_stage.result == 'success'
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Ling 3.0 Flash
      reviewer_slug: ling
      model: inclusionai/ling-3.0-flash:free
      pr_number: ${{ github.event.pull_request.number }}
      expected_head: ${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-ling-auto-review -->'
      manual_marker: '<!-- teamai-ling-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_OPENAI }}

  poolside:
    needs: delay_to_second_stage
    if: always() && needs.delay_to_second_stage.result == 'success'
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Poolside
      reviewer_slug: poolside
      model: poolside/laguna-xs-2.1:free
      pr_number: ${{ github.event.pull_request.number }}
      expected_head: ${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-poolside-auto-review -->'
      manual_marker: '<!-- teamai-poolside-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_POOLSIDE }}

  delay_to_third_stage:
    needs: [ling, poolside]
    if: always() && (needs.ling.result == 'success' || needs.ling.result == 'failure') && (needs.poolside.result == 'success' || needs.poolside.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reconfirm exact head before starting the stage-2 barrier
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          [[ "$current_head" == "$HEAD" ]] || {
            echo "PR head changed before stage-2 interval: expected $HEAD, found $current_head."
            exit 1
          }
          draft_state="$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')"
          [[ "$draft_state" == "false" ]] || {
            echo "PR became draft before stage-2 interval; later automatic stages are blocked."
            exit 1
          }

      - name: Wait 2 minutes 30 seconds after Ling 3.0 Flash and Poolside turn
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sleep "$REVIEW_INTERVAL_SECONDS"
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          [[ "$current_head" == "$HEAD" ]] || {
            echo "PR head changed during stage-2 interval: expected $HEAD, found $current_head."
            exit 1
          }
          draft_state="$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')"
          [[ "$draft_state" == "false" ]] || {
            echo "PR became draft during stage-2 interval; later automatic stages are blocked."
            exit 1
          }

  laguna:
    needs: delay_to_third_stage
    if: always() && needs.delay_to_third_stage.result == 'success'
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Laguna
      reviewer_slug: laguna
      model: poolside/laguna-s-2.1:free
      pr_number: ${{ github.event.pull_request.number }}
      expected_head: ${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-laguna-auto-review -->'
      manual_marker: '<!-- teamai-laguna-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_DEEPSEEK }}

  dots3:
    needs: delay_to_third_stage
    if: always() && needs.delay_to_third_stage.result == 'success'
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: Dots3-Note Preview
      reviewer_slug: dots3
      model: dots-studio/dots-3-note-preview:free
      pr_number: ${{ github.event.pull_request.number }}
      expected_head: ${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-dots3-auto-review -->'
      manual_marker: '<!-- teamai-dots3-review -->'
      approve: false
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY_GWEN }}

  sequence_complete:
    needs: [claim, laguna, dots3]
    if: always() && needs.claim.result == 'success' && needs.claim.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Verify five automatic reviewer outputs on the exact sequence head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          COMPLETE_MARKER: ${{ env.SEQUENCE_COMPLETE_MARKER }}
          NEMOTRON_MARKER: ${{ env.NEMOTRON_AUTO_MARKER }}
          LING_MARKER: ${{ env.LING_AUTO_MARKER }}
          POOLSIDE_MARKER: ${{ env.POOLSIDE_AUTO_MARKER }}
          LAGUNA_MARKER: ${{ env.LAGUNA_AUTO_MARKER }}
          DOTS3_MARKER: ${{ env.DOTS3_AUTO_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          [[ "$current_head" == "$HEAD" ]] || {
            echo "PR head changed before completion check: expected $HEAD, found $current_head."
            exit 1
          }
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"
          missing=0
          for marker in "$NEMOTRON_MARKER" "$LING_MARKER" "$POOLSIDE_MARKER" "$LAGUNA_MARKER" "$DOTS3_MARKER"; do
            if jq -e --arg marker "$marker" --arg head "$HEAD" 'any(.[]; ((.body // "") | contains($marker) and contains(("Exact PR head: `" + $head + "`"))))' <<< "$comments" >/dev/null; then
              echo "PASS: reviewer marker $marker exists for exact head $HEAD."
            else
              echo "MISSING: reviewer marker $marker is absent for exact head $HEAD."
              missing=$((missing + 1))
            fi
          done
          if (( missing > 0 )); then
            echo "Automatic advisory sequence is incomplete: $missing reviewer output(s) missing for exact head $HEAD."
            exit 1
          fi
          if jq -e --arg marker "$COMPLETE_MARKER" --arg head "$HEAD" 'any(.[]; ((.body // "") | contains($marker) and contains(("Exact PR head: `" + $head + "`"))))' <<< "$comments" >/dev/null; then
            echo "Sequence-complete marker already exists for exact head $HEAD."
            exit 0
          fi
          body="$(printf '%s\n\n%s\n%s\n%s' "$COMPLETE_MARKER" '# Automatic AI Advisory Review Sequence Complete' "Exact PR head: \`$HEAD\`" 'All five automatic reviewer output markers are present on this exact head. Provider quota consumption is bounded to the five reserved reviewer slots.')"
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo "Automatic advisory review sequence is complete for exact head $HEAD."
