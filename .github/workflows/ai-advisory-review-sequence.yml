name: AI Advisory Review Sequence

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-review-sequence-\${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VALIDATION_POLL_SECONDS: '15'
  VALIDATION_TIMEOUT_SECONDS: '1800'
  SEQUENCE_MARKER: '<!-- teamai-ai-review-sequence-auto -->'
  SEQUENCE_COMPLETE_MARKER: '<!-- teamai-ai-review-sequence-complete -->'

jobs:
  eligibility:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_run: \${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate one quota-safe automatic review sequence per PR
        id: gate
        env:
          GH_TOKEN: \${{ github.token }}
          REPO: \${{ github.repository }}
          PR: \${{ github.event.pull_request.number }}
          HEAD: \${{ github.event.pull_request.head.sha }}
          MARKER: \${{ env.SEQUENCE_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"

          complete=true
          for slot in 1 2 3 4 5; do
            marker="<!-- teamai-openrouter-free-slot-$slot-auto-review -->"
            if ! jq -e --arg marker "$marker" --arg head "$HEAD" 'any(.[]; ((.body // "") | contains($marker) and contains(("Exact PR head: " + $head))))' <<< "$comments" >/dev/null; then
              complete=false
              break
            fi
          done
          if [[ "$complete" == "true" ]]; then
            echo "All five OpenRouter Free advisory outputs are recorded on exact head $HEAD; sequence is complete for this PR."
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e --arg marker "$MARKER" 'any(.[]; (.body // "") | contains($marker))' <<< "$comments" >/dev/null; then
            echo "An automatic sequence claim already exists for PR #$PR. The five-call quota is frozen and synchronize/reopen events must not restart it."
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'should_run=true' >> "$GITHUB_OUTPUT"
          echo "PR #$PR is eligible for one quota-safe five-slot OpenRouter Free advisory sequence on exact head $HEAD."

  validation_gate:
    needs: eligibility
    if: needs.eligibility.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Wait for required substantive validation to finish before sequence claim
        env:
          GH_TOKEN: \${{ github.token }}
          REPO: \${{ github.repository }}
          PR: \${{ github.event.pull_request.number }}
          HEAD: \${{ github.event.pull_request.head.sha }}
          POLL_SECONDS: \${{ env.VALIDATION_POLL_SECONDS }}
          TIMEOUT_SECONDS: \${{ env.VALIDATION_TIMEOUT_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "governance-drift"
            "evidence-consistency"
            "agent-validation"
            "Recovery integrity"
            "Project tests + canonical package"
            "Playwright browser verification"
          )
          if [[ "$GITHUB_BASE_REF" == "main" ]]; then
            required+=("CodeQL analyze (javascript-typescript)")
          fi
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          while true; do
            current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            draft_state="$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')"
            if [[ "$current_head" != "$HEAD" ]]; then
              echo "PR head changed during validation gate: expected $HEAD, found $current_head."
              exit 1
            fi
            if [[ "$draft_state" != "false" ]]; then
              echo "PR is no longer non-draft during validation gate; automatic reviewer sequence will not start."
              exit 1
            fi
            checks="$(gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100")"
            pending=0
            failed=0
            missing=0
            for name in "\${required[@]}"; do
              check="$(jq -c --arg name "$name" --arg head "$HEAD" '[.check_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.started_at // .created_at) | last // empty' <<< "$checks")"
              if [[ -z "$check" ]]; then
                echo "$name: status=MISSING conclusion=MISSING"
                missing=$((missing + 1))
                continue
              fi
              status="$(jq -r '.status' <<< "$check")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$check")"
              echo "$name: status=$status conclusion=\${conclusion:-PENDING}"
              if [[ "$status" != "completed" ]]; then
                pending=$((pending + 1))
              elif [[ "$conclusion" != "success" ]]; then
                failed=$((failed + 1))
              fi
            done
            if (( failed > 0 )); then
              echo "Required substantive validation failed. Automatic reviewer sequence will not start."
              exit 1
            fi
            if (( missing == 0 && pending == 0 )); then
              echo "All required substantive validators passed on exact head $HEAD."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for required substantive validators on exact head $HEAD."
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

  claim:
    needs: [eligibility, validation_gate]
    if: needs.eligibility.outputs.should_run == 'true' && needs.validation_gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      claimed: \${{ steps.claim.outputs.claimed }}
    steps:
      - name: Claim the automatic five-slot sequence only after validations pass
        id: claim
        env:
          GH_TOKEN: \${{ github.token }}
          REPO: \${{ github.repository }}
          PR: \${{ github.event.pull_request.number }}
          HEAD: \${{ github.event.pull_request.head.sha }}
          MARKER: \${{ env.SEQUENCE_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          if [[ "$current_head" != "$HEAD" ]]; then
            echo "Head changed before sequence claim: expected $HEAD, found $current_head."
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"
          if jq -e --arg marker "$MARKER" 'any(.[]; (.body // "") | contains($marker))' <<< "$comments" >/dev/null; then
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            echo 'A durable automatic sequence claim already exists; no second sequence is permitted.'
            exit 0
          fi
          body="$(printf '%s\n\n%s\n%s\n%s\n%s' "$MARKER" '# Automatic OpenRouter Free Advisory Review Sequence' "Exact PR head: $HEAD" 'Routing: five parallel OpenRouter Free Router slots using model openrouter/free with one shared OpenRouter API key.' 'State: CLAIMED' 'Provider budget: maximum 5 automatic OpenRouter HTTP requests; no inter-slot interval or staged barrier is used.')"
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

  openrouter_free:
    needs: claim
    if: needs.claim.outputs.claimed == 'true'
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5]
    uses: ./.github/workflows/ai-advisory-review-runner.yml
    with:
      reviewer: OpenRouter Free Slot \${{ matrix.slot }}
      reviewer_slug: openrouter-free-\${{ matrix.slot }}
      model: openrouter/free
      pr_number: \${{ github.event.pull_request.number }}
      expected_head: \${{ github.event.pull_request.head.sha }}
      invocation_class: automatic
      automatic_marker: '<!-- teamai-openrouter-free-slot-\${{ matrix.slot }}-auto-review -->'
      automatic_start_marker: '<!-- teamai-openrouter-free-slot-\${{ matrix.slot }}-provider-started -->'
      manual_marker: '<!-- teamai-openrouter-free-slot-\${{ matrix.slot }}-manual-review -->'
      approve: false
    secrets:
      api_key: \${{ secrets.OPENROUTER_API_KEY }}

  sequence_complete:
    needs: [claim, openrouter_free]
    if: always() && needs.claim.result == 'success' && needs.claim.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Verify all five automatic router outputs on the exact sequence head
        env:
          GH_TOKEN: \${{ github.token }}
          REPO: \${{ github.repository }}
          PR: \${{ github.event.pull_request.number }}
          HEAD: \${{ github.event.pull_request.head.sha }}
          COMPLETE_MARKER: \${{ env.SEQUENCE_COMPLETE_MARKER }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          [[ "$current_head" == "$HEAD" ]] || {
            echo "PR head changed before completion check: expected $HEAD, found $current_head."
            exit 1
          }
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate)"
          missing=0
          for slot in 1 2 3 4 5; do
            marker="<!-- teamai-openrouter-free-slot-$slot-auto-review -->"
            if jq -e --arg marker "$marker" --arg head "$HEAD" 'any(.[]; ((.body // "") | contains($marker) and contains(("Exact PR head: " + $head))))' <<< "$comments" >/dev/null; then
              echo "PASS: OpenRouter Free Slot $slot output marker exists for exact head $HEAD."
            else
              echo "MISSING: OpenRouter Free Slot $slot output marker is absent for exact head $HEAD."
              missing=$((missing + 1))
            fi
          done
          if (( missing > 0 )); then
            echo "Automatic OpenRouter Free advisory sequence is incomplete: $missing slot output(s) missing for exact head $HEAD."
            exit 1
          fi
          if jq -e --arg marker "$COMPLETE_MARKER" --arg head "$HEAD" 'any(.[]; ((.body // "") | contains($marker) and contains(("Exact PR head: " + $head))))' <<< "$comments" >/dev/null; then
            echo "Sequence-complete marker already exists for exact head $HEAD."
            exit 0
          fi
          body="$(printf '%s\n\n%s\n%s\n%s' "$COMPLETE_MARKER" '# Automatic OpenRouter Free Advisory Review Sequence Complete' "Exact PR head: $HEAD" 'All five parallel OpenRouter Free Router slots posted their bounded advisory results for this exact head. The sequence consumed at most five provider HTTP requests and used no inter-slot timers.')"
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo "Automatic OpenRouter Free advisory review sequence is complete for exact head $HEAD."
