name: One-time Governance Migration

on:
  push:
    branches:
      - governance/repository-foundation

permissions:
  contents: write

jobs:
  migrate:
    if: startsWith(github.event.head_commit.message, '346: trigger canonical migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact canonical root migration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p Product_Law Masterplan docs/archive

          # Replace temporary branch copies with exact historical Product Law / Masterplan contents.
          if test -f PRODUCT_LAW.md; then
            rm -f Product_Law/PRODUCT_LAW.md
            git mv PRODUCT_LAW.md Product_Law/PRODUCT_LAW.md
          fi
          if test -f MASTERPLAN.md; then
            rm -f Masterplan/MASTERPLAN.md
            git mv MASTERPLAN.md Masterplan/MASTERPLAN.md
          fi
          if test -f NEXT_SLICES.md; then
            rm -f Masterplan/NEXT_SLICES.md
            git mv NEXT_SLICES.md Masterplan/NEXT_SLICES.md
          fi

          # Active HandOver/Endorsement are retired; historical evidence is retained.
          if test -f docs/project-guide/HandOver.md; then
            git mv docs/project-guide/HandOver.md docs/archive/HandOver_legacy_2026-09-15.md
          fi
          if test -f docs/project-guide/Endorsement.md; then
            git mv docs/project-guide/Endorsement.md docs/archive/Endorsement_legacy_2026-09-15.md
          fi

          # Retire the accidental parallel Skill namespace.
          if test -d docs/skills; then
            find docs/skills -type f -print0 | xargs -0 -r git rm
            rmdir docs/skills || true
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          skip = {'node_modules', '.git'}
          historical = ('docs/archive/', 'docs/evidence/', 'handover/')
          replacements = [
              (re.compile(r'(?<!Product_Law/)PRODUCT_LAW\.md'), 'Product_Law/PRODUCT_LAW.md'),
              (re.compile(r'(?<!Masterplan/)MASTERPLAN\.md'), 'Masterplan/MASTERPLAN.md'),
              (re.compile(r'(?<!Masterplan/)NEXT_SLICES\.md'), 'Masterplan/NEXT_SLICES.md'),
              (re.compile(r'docs/project-guide/Endorsement\.md'), 'AI_ASSISTANT_READ_ME.md'),
              (re.compile(r'docs/project-guide/HandOver\.md'), 'AI_ASSISTANT_READ_ME.md'),
              (re.compile(r'docs/project-guide/HandOver'), 'handover/'),
          ]
          for p in root.rglob('*'):
              if not p.is_file() or any(x in skip for x in p.parts):
                  continue
              rel = p.as_posix()
              if rel.startswith(historical) or rel == '.github/workflows/reconcile-346-once.yml':
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = text
              for pattern, replacement in replacements:
                  new = pattern.sub(replacement, new)
              if new != text:
                  p.write_text(new, encoding='utf-8')
          PY

          # Ensure archive index documents the newly retired acceptance record.
          if test -f docs/archive/INDEX.md && ! grep -q 'Endorsement_legacy_2026-09-15.md' docs/archive/INDEX.md; then
            cat >> docs/archive/INDEX.md <<'EOF'

## 2026-09-15 governance migration
- `Endorsement_legacy_2026-09-15.md` — retired active acceptance document; acceptance decisions now follow the current session/PR/evidence model.
EOF
          fi

          rm -f .github/workflows/reconcile-346-once.yml
          rm -f .github/teamai/.canonical-migration-marker

          git add -A
          git diff --check
          git status --short
          git commit -m "346: complete canonical root migration"
          git push origin HEAD:governance/repository-foundation
