name: Repository Governance Integrity

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches:
      - main
      - governance/repository-foundation

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-drift:
    name: governance-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve governed PR proof base
        id: proof-context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$GITHUB_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "null" ]; then
            echo "No governance base SHA could be resolved for ${REF_NAME}."
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "proof_base_sha=$base_sha"

      - name: Syntax check governance validators
        run: |
          node --check scripts/governance/verify-evidence-integrity.mjs
          python3 -m py_compile build-system/scripts/repository-canonical-governance-audit.py

      - name: Prove draft PR target against full PR delta
        env:
          BASE_SHA: ${{ steps.proof-context.outputs.base_sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build-system/scripts/repository-canonical-governance-audit.py

  evidence-consistency:
    name: evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify evidence boundaries
        run: node scripts/governance/verify-evidence-integrity.mjs

  agent-validation:
    name: agent-validation
    needs:
      - governance-drift
      - evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate agent validation packet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .validation
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            commit: process.env.COMMIT_SHA,
            base_commit: process.env.BASE_SHA || null,
            event: process.env.EVENT_NAME,
            governance_drift: 'PASS',
            evidence_consistency: 'PASS',
            validated: true,
            verdict: 'AGENT-WORK-VALID',
          };
          fs.writeFileSync('.validation/teamai-validation.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          cat .validation/teamai-validation.json
      - name: Publish validation packet
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: .validation/teamai-validation.json
          if-no-files-found: error

  review-readiness:
    name: review-readiness
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Require a human approval on the exact current PR head, with that head's own checks green, and block auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" > /tmp/reviews.json
          gh api "/repos/${REPO}/pulls/${PR_NUMBER}" > /tmp/pr.json
          auto_merge=$(jq -r 'if .auto_merge == null then "false" else "true" end' /tmp/pr.json)
          echo "auto_merge_enabled=$auto_merge"
          if [ "$auto_merge" = "true" ]; then
            echo "REVIEW_READINESS=FAIL"
            echo "TeamAi policy forbids auto-merge for product changes."
            exit 1
          fi
          approved=$(jq --arg head "$HEAD_SHA" --arg author "$PR_AUTHOR" '[.[] | select(.state == "APPROVED") | select(.commit_id == $head) | select(.user.login != $author) | select(.user.type != "Bot")] | length' /tmp/reviews.json)
          echo "exact_head_human_approvals=$approved"
          if [ "$approved" -lt 1 ]; then
            echo "REVIEW_READINESS=FAIL"
            echo "No non-author human approval exists for the exact current PR head $HEAD_SHA."
            exit 1
          fi
          # Verify this exact head's own required governance checks are
          # green, queried live via the Checks API rather than a
          # workflow-level `needs:`, so this job can be re-evaluated on a
          # pull_request_review event (late approval) without re-running
          # the full governance/test suite just to re-satisfy `needs`.
          gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" --paginate > /tmp/checkruns.json
          for required in governance-drift evidence-consistency agent-validation; do
            conclusion=$(jq -r --arg name "$required" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last | .conclusion // "missing"' /tmp/checkruns.json)
            echo "required_check=${required} conclusion=${conclusion}"
            if [ "$conclusion" != "success" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "Required check '${required}' is not success (found: ${conclusion}) on exact head $HEAD_SHA."
              exit 1
            fi
          done
          echo "REVIEW_READINESS=PASS"
