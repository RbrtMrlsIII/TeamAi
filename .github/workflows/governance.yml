name: Repository Governance Integrity

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches:
      - main
      - governance/repository-foundation

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-governance-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  governance-drift:
    name: governance-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve governed PR proof base
        id: proof-context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$GITHUB_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "null" ]; then
            echo "No governance base SHA could be resolved for ${REF_NAME}."
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "proof_base_sha=$base_sha"

      - name: Syntax check governance validators
        run: |
          node --check scripts/governance/verify-evidence-integrity.mjs
          node --check scripts/governance/verify-advisory-control-plane.mjs
          python3 -m py_compile build-system/scripts/repository-canonical-governance-audit.py

      - name: Verify advisory reviewer control plane
        run: node scripts/governance/verify-advisory-control-plane.mjs

      - name: Prove draft PR target against full PR delta
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.proof-context.outputs.base_sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build-system/scripts/repository-canonical-governance-audit.py

  evidence-consistency:
    name: evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify evidence boundaries
        run: node scripts/governance/verify-evidence-integrity.mjs

  agent-validation:
    name: agent-validation
    needs:
      - governance-drift
      - evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate agent validation packet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .validation
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            commit: process.env.COMMIT_SHA,
            base_commit: process.env.BASE_SHA || null,
            event: process.env.EVENT_NAME,
            governance_drift: 'PASS',
            evidence_consistency: 'PASS',
            validated: true,
            verdict: 'AGENT-WORK-VALID',
          };
          fs.writeFileSync('.validation/teamai-validation.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          cat .validation/teamai-validation.json
      - name: Publish validation packet
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: .validation/teamai-validation.json
          if-no-files-found: error

  review-readiness:
    name: review-readiness
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait for a non-author human approval on the exact current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          poll_seconds=15
          while true; do
            gh api "/repos/${REPO}/pulls/${PR_NUMBER}" > /tmp/pr.json
            current_head=$(jq -r '.head.sha' /tmp/pr.json)
            draft_state=$(jq -r '.draft' /tmp/pr.json)
            auto_merge=$(jq -r 'if .auto_merge == null then "false" else "true" end' /tmp/pr.json)
            echo "current_head=$current_head"
            echo "draft=$draft_state"
            echo "auto_merge_enabled=$auto_merge"

            if [ "$current_head" != "$HEAD_SHA" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "Exact-head authorization state is stale: expected $HEAD_SHA, found $current_head."
              exit 1
            fi
            if [ "$draft_state" != "false" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "PR returned to Draft; review-readiness is not a promotion gate for Draft PRs."
              exit 1
            fi
            if [ "$auto_merge" = "true" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "TeamAi policy forbids auto-merge for product changes."
              exit 1
            fi

            gh api --paginate "/repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" > /tmp/reviews.json
            approved=$(jq --arg head "$HEAD_SHA" --arg author "$PR_AUTHOR" '[.[] | select(.state == "APPROVED") | select(.commit_id == $head) | select(.user.login != $author) | select(.user.type != "Bot")] | length' /tmp/reviews.json)
            echo "exact_head_human_approvals=$approved"
            if [ "$approved" -ge 1 ]; then
              required=(governance-drift evidence-consistency agent-validation)
              checkruns=$(gh api --paginate "/repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100")
              pending=0
              failed=0
              for required_check in "${required[@]}"; do
                check=$(jq -c --arg name "$required_check" --arg head "$HEAD_SHA" '[.check_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.started_at // .completed_at) | last // empty' <<< "$checkruns")
                if [ -z "$check" ]; then
                  echo "required_check=${required_check} status=missing conclusion=pending"
                  pending=$((pending+1))
                  continue
                fi
                status=$(jq -r '.status' <<< "$check")
                conclusion=$(jq -r '.conclusion // ""' <<< "$check")
                echo "required_check=${required_check} status=${status} conclusion=${conclusion:-PENDING}"
                if [ "$status" != "completed" ]; then
                  pending=$((pending+1))
                  continue
                fi
                if [ "$conclusion" != "success" ]; then
                  failed=$((failed+1))
                fi
              done
              if [ "$failed" -gt 0 ]; then
                echo "REVIEW_READINESS=FAIL"
                echo "One or more required governance checks completed unsuccessfully on exact head ${HEAD_SHA}."
                exit 1
              fi
              if [ "$pending" -gt 0 ]; then
                echo "REVIEW_READINESS=WAITING_FOR_REQUIRED_CHECKS"
                echo "Required governance checks are still missing or incomplete on exact head ${HEAD_SHA}; polling again."
                sleep "$poll_seconds"
                continue
              fi
              echo "REVIEW_READINESS=PASS"
              echo "Independent human approval exists on the exact current PR head $HEAD_SHA and required governance checks are green."
              exit 0
            fi

            echo "REVIEW_READINESS=WAITING"
            echo "Waiting for a non-author human APPROVED review on exact head $HEAD_SHA."
            sleep "$poll_seconds"
          done
