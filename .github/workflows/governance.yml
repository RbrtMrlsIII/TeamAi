name: Repository Governance Integrity

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches:
      - main
      - governance/repository-foundation

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-drift:
    name: governance-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve governed PR proof base
        id: proof-context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$GITHUB_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "null" ]; then
            echo "No governance base SHA could be resolved for ${REF_NAME}."
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "proof_base_sha=$base_sha"

      - name: Syntax check governance validators
        run: |
          node --check scripts/governance/verify-evidence-integrity.mjs
          python3 -m py_compile build-system/scripts/repository-canonical-governance-audit.py

      - name: Verify advisory reviewer stage consistency
        shell: bash
        run: |
          set -euo pipefail
          expected='Nemotron → 2 minutes 30 seconds → Ling 3.0 Flash + Poolside → 2 minutes 30 seconds → Dots3-Note Preview (primary) + Dots3-Note Preview (secondary)'
          workflow='.github/workflows/ai-advisory-review-sequence.yml'
          grep -Fq "REVIEW_INTERVAL_SECONDS: '150'" "$workflow"
          grep -Fq "$expected" "$workflow"
          grep -Fq 'reviewer: Nemotron' "$workflow"
          grep -Fq 'reviewer: Ling 3.0 Flash' "$workflow"
          grep -Fq 'reviewer: Poolside' "$workflow"
           grep -Fq 'api_key: ${{ secrets.OPENROUTER_API_KEY }}' "$workflow"
           grep -Fq 'api_key: ${{ secrets.OPENROUTER_API_KEY_OPENAI }}' "$workflow"
           grep -Fq 'api_key: ${{ secrets.OPENROUTER_API_KEY_POOLSIDE }}' "$workflow"
           grep -Fq 'api_key: ${{ secrets.OPENROUTER_API_KEY_DEEPSEEK }}' "$workflow"
           grep -Fq 'api_key: ${{ secrets.OPENROUTER_API_KEY_GWEN }}' "$workflow"
          grep -Fq 'reviewer: Dots3-Note Preview (primary)' "$workflow"
          grep -Fq 'reviewer: Dots3-Note Preview (secondary)' "$workflow"
          grep -Fq 'needs: delay_to_second_stage' "$workflow"
          grep -Fq "if: always() && needs.delay_to_second_stage.result == 'success'" "$workflow"
          grep -Fq 'needs: [ling, poolside]' "$workflow"
          grep -Fq 'needs: delay_to_third_stage' "$workflow"
          grep -Fq "if: always() && (needs.nemotron.result == 'success' || needs.nemotron.result == 'failure')" "$workflow"
          grep -Fq "if: always() && (needs.ling.result == 'success' || needs.ling.result == 'failure') && (needs.poolside.result == 'success' || needs.poolside.result == 'failure')" "$workflow"
          grep -Fq 'Reconfirm exact head before starting the stage-1 barrier' "$workflow"
          grep -Fq 'Reconfirm exact head before starting the stage-2 barrier' "$workflow"
          grep -Fq 'model: nvidia/nemotron-3.5-lightning:free' "$workflow"
          grep -Fq 'model: inclusionai/ling-3.0-flash:free' "$workflow"
          grep -Fq 'model: poolside/laguna-s-2.1:free' "$workflow"
          grep -Fq 'model: dots-studio/dots-3-note-preview:free' "$workflow"
          test "$(grep -Fc 'model: dots-studio/dots-3-note-preview:free' "$workflow")" -eq 2
          if grep -Fq "needs.nemotron.result != 'cancelled'" "$workflow"; then
            echo "Skipped/cancelled fallthrough remains in the Nemotron barrier."
            exit 1
          fi
          if grep -Fq "needs.ling.result != 'cancelled'" "$workflow" || grep -Fq "needs.poolside.result != 'cancelled'" "$workflow"; then
            echo "Skipped/cancelled fallthrough remains in the stage-3 barrier."
            exit 1
          fi
          for path in \
            'POLICY.md' \
            'docs/SKILL_WIRING.md' \
            'skills/governance/ai-advisory-review/SKILL.md' \
            'Masterplan/MASTERPLAN.md' \
            'AI_ASSISTANT_READ_ME.md' \
            'Product_Law/WIRING.md'; do
            test -f "$path"
            grep -Fq "$expected" "$path" || {
              echo "Advisory reviewer stage drift detected in $path"
              exit 1
            }
            if grep -Fq '5-minute interval' "$path"; then
              echo "Retired 5-minute interval wording remains in $path"
              exit 1
            fi
            if grep -Fq 'Nemotron → 2 minutes 30 seconds → DeepSeek → 2 minutes 30 seconds → Qwen' "$path"; then
              echo "Retired three-stage sequence wording remains in $path"
              exit 1
            fi
            if grep -Fq 'terminal non-cancelled' "$path" || grep -Fq 'completed non-cancelled' "$path"; then
              echo "Ambiguous non-cancelled barrier wording remains in $path"
              exit 1
            fi
          done
          echo "Advisory reviewer stages are synchronized: 1 → 2 → 2 with 150-second inter-stage waits, explicit success/failure barriers, and explicit free routes, with pinned free model identities and stable secret aliases."

      - name: Prove draft PR target against full PR delta
        env:
          BASE_SHA: ${{ steps.proof-context.outputs.base_sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build-system/scripts/repository-canonical-governance-audit.py

  evidence-consistency:
    name: evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify evidence boundaries
        run: node scripts/governance/verify-evidence-integrity.mjs

  agent-validation:
    name: agent-validation
    needs:
      - governance-drift
      - evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate agent validation packet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .validation
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            commit: process.env.COMMIT_SHA,
            base_commit: process.env.BASE_SHA || null,
            event: process.env.EVENT_NAME,
            governance_drift: 'PASS',
            evidence_consistency: 'PASS',
            validated: true,
            verdict: 'AGENT-WORK-VALID',
          };
          fs.writeFileSync('.validation/teamai-validation.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          cat .validation/teamai-validation.json
      - name: Publish validation packet
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: .validation/teamai-validation.json
          if-no-files-found: error

  review-readiness:
    name: review-readiness
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait for a non-author human approval on the exact current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          poll_seconds=15
          while true; do
            gh api "/repos/${REPO}/pulls/${PR_NUMBER}" > /tmp/pr.json
            current_head=$(jq -r '.head.sha' /tmp/pr.json)
            draft_state=$(jq -r '.draft' /tmp/pr.json)
            auto_merge=$(jq -r 'if .auto_merge == null then "false" else "true" end' /tmp/pr.json)
            echo "current_head=$current_head"
            echo "draft=$draft_state"
            echo "auto_merge_enabled=$auto_merge"

            if [ "$current_head" != "$HEAD_SHA" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "Exact-head authorization state is stale: expected $HEAD_SHA, found $current_head."
              exit 1
            fi
            if [ "$draft_state" != "false" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "PR returned to Draft; review-readiness is not a promotion gate for Draft PRs."
              exit 1
            fi
            if [ "$auto_merge" = "true" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "TeamAi policy forbids auto-merge for product changes."
              exit 1
            fi

            gh api --paginate "/repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" > /tmp/reviews.json
            approved=$(jq --arg head "$HEAD_SHA" --arg author "$PR_AUTHOR" '[.[] | select(.state == "APPROVED") | select(.commit_id == $head) | select(.user.login != $author) | select(.user.type != "Bot")] | length' /tmp/reviews.json)
            echo "exact_head_human_approvals=$approved"
            if [ "$approved" -ge 1 ]; then
              required=(governance-drift evidence-consistency agent-validation)
              checkruns=$(gh api --paginate "/repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100")
              for required_check in "${required[@]}"; do
                conclusion=$(jq -r --arg name "$required_check" --arg head "$HEAD_SHA" '[.check_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.started_at // .completed_at) | last | .conclusion // "missing"' <<< "$checkruns")
                echo "required_check=${required_check} conclusion=${conclusion}"
                if [ "$conclusion" != "success" ]; then
                  echo "REVIEW_READINESS=FAIL"
                  echo "Required check ${required_check} is not successful on exact head ${HEAD_SHA}."
                  exit 1
                fi
              done
              echo "REVIEW_READINESS=PASS"
              echo "Independent human approval exists on the exact current PR head $HEAD_SHA and required governance checks are green."
              exit 0
            fi

            echo "REVIEW_READINESS=WAITING"
            echo "Waiting for a non-author human APPROVED review on exact head $HEAD_SHA."
            sleep "$poll_seconds"
          done
