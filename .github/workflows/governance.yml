name: Repository Governance Integrity

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches:
      - main
      - governance/repository-foundation

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-drift:
    name: governance-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve governed PR proof base
        id: proof-context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$GITHUB_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "null" ]; then
            echo "No governance base SHA could be resolved for ${REF_NAME}."
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "proof_base_sha=$base_sha"

      - name: Syntax check governance validators
        run: |
          node --check scripts/governance/verify-evidence-integrity.mjs
          python3 -m py_compile build-system/scripts/repository-canonical-governance-audit.py

      - name: Verify advisory reviewer stage consistency
        shell: bash
        run: |
          set -euo pipefail
          expected='OpenRouter Free Router → 5 parallel slots → no inter-slot interval; terminal slot outcome is explicit; actual routed model/provider recorded on successful review'
          workflow='.github/workflows/ai-advisory-review-sequence.yml'
          grep -Fq 'model: openrouter/free' "$workflow"
          grep -Fq 'strategy:' "$workflow"
          grep -Fq 'fail-fast: false' "$workflow"
          grep -Fq 'slot: [1, 2, 3, 4, 5]' "$workflow"
          grep -Fq 'reviewer: OpenRouter Free Slot' "$workflow"
          grep -Fq 'reviewer_slug: openrouter-free-' "$workflow"
          grep -Fq 'secrets.OPENROUTER_API_KEY }}' "$workflow"
          test "$(grep -Fc 'model: openrouter/free' "$workflow")" -eq 1
          test "$(grep -Fc 'openrouter-free-' "$workflow")" -ge 3
          if grep -Fq 'REVIEW_INTERVAL_SECONDS' "$workflow" || grep -Fq 'delay_to_second_stage' "$workflow" || grep -Fq 'delay_to_third_stage' "$workflow"; then
            echo "Retired inter-slot interval/barrier logic remains in the active sequence workflow."
            exit 1
          fi
          if grep -Fq 'nvidia/nemotron' "$workflow" || grep -Fq 'inclusionai/ling' "$workflow" || grep -Fq 'poolside/laguna' "$workflow" || grep -Fq 'dots-studio/dots-3' "$workflow"; then
            echo "Named-model reviewer bindings remain in the active sequence workflow."
            exit 1
          fi
          grep -Fq 'needs: [claim, openrouter_free]' "$workflow"
          grep -Fq "if: always() && needs.claim.result == 'success'" "$workflow"
          grep -Fq 'automatic_outcome_marker' "$workflow"
          grep -Fq 'Publish durable automatic slot outcome' ".github/workflows/ai-advisory-review-runner.yml"
          grep -Fq 'Return only the following compact review structure' ".github/workflows/ai-advisory-review-runner.yml"
          grep -Fq 'Slot outcome: SUCCEEDED' ".github/workflows/ai-advisory-review-runner.yml"
          if grep -Fq 'automatic_start_marker' "$workflow" || grep -Fq 'Reserve automatic provider invocation slot' ".github/workflows/ai-advisory-review-runner.yml"; then
            echo "Obsolete per-slot reservation state remains in the active advisory control plane."
            exit 1
          fi
          for path in             'POLICY.md'             'docs/SKILL_WIRING.md'             'skills/governance/ai-advisory-review/SKILL.md'             'Masterplan/MASTERPLAN.md'             'AI_ASSISTANT_READ_ME.md'             'Product_Law/WIRING.md'; do
            test -f "$path"
            grep -Fq "$expected" "$path" || {
              echo "Advisory reviewer routing drift detected in $path"
              exit 1
            }
            if grep -Fq '2 minutes 30 seconds' "$path" || grep -Fq '150-second' "$path" || grep -Fq '150 seconds' "$path"; then
              echo "Retired inter-slot timing wording remains in $path"
              exit 1
            fi
          done
          echo "Advisory reviewer control plane is synchronized: five parallel Free Router slots, one shared key, no inter-slot timers, explicit terminal slot outcomes, compact structured model evidence, exact-head guards, and one-sequence quota protection."

      - name: Prove draft PR target against full PR delta
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.proof-context.outputs.base_sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build-system/scripts/repository-canonical-governance-audit.py

  evidence-consistency:
    name: evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify evidence boundaries
        run: node scripts/governance/verify-evidence-integrity.mjs

  agent-validation:
    name: agent-validation
    needs:
      - governance-drift
      - evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate agent validation packet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .validation
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            commit: process.env.COMMIT_SHA,
            base_commit: process.env.BASE_SHA || null,
            event: process.env.EVENT_NAME,
            governance_drift: 'PASS',
            evidence_consistency: 'PASS',
            validated: true,
            verdict: 'AGENT-WORK-VALID',
          };
          fs.writeFileSync('.validation/teamai-validation.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          cat .validation/teamai-validation.json
      - name: Publish validation packet
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: .validation/teamai-validation.json
          if-no-files-found: error

  review-readiness:
    name: review-readiness
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait for a non-author human approval on the exact current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          poll_seconds=15
          while true; do
            gh api "/repos/${REPO}/pulls/${PR_NUMBER}" > /tmp/pr.json
            current_head=$(jq -r '.head.sha' /tmp/pr.json)
            draft_state=$(jq -r '.draft' /tmp/pr.json)
            auto_merge=$(jq -r 'if .auto_merge == null then "false" else "true" end' /tmp/pr.json)
            echo "current_head=$current_head"
            echo "draft=$draft_state"
            echo "auto_merge_enabled=$auto_merge"

            if [ "$current_head" != "$HEAD_SHA" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "Exact-head authorization state is stale: expected $HEAD_SHA, found $current_head."
              exit 1
            fi
            if [ "$draft_state" != "false" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "PR returned to Draft; review-readiness is not a promotion gate for Draft PRs."
              exit 1
            fi
            if [ "$auto_merge" = "true" ]; then
              echo "REVIEW_READINESS=FAIL"
              echo "TeamAi policy forbids auto-merge for product changes."
              exit 1
            fi

            gh api --paginate "/repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" > /tmp/reviews.json
            approved=$(jq --arg head "$HEAD_SHA" --arg author "$PR_AUTHOR" '[.[] | select(.state == "APPROVED") | select(.commit_id == $head) | select(.user.login != $author) | select(.user.type != "Bot")] | length' /tmp/reviews.json)
            echo "exact_head_human_approvals=$approved"
            if [ "$approved" -ge 1 ]; then
              required=(governance-drift evidence-consistency agent-validation)
              checkruns=$(gh api --paginate "/repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100")
              for required_check in "${required[@]}"; do
                conclusion=$(jq -r --arg name "$required_check" --arg head "$HEAD_SHA" '[.check_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.started_at // .completed_at) | last | .conclusion // "missing"' <<< "$checkruns")
                echo "required_check=${required_check} conclusion=${conclusion}"
                if [ "$conclusion" != "success" ]; then
                  echo "REVIEW_READINESS=FAIL"
                  echo "Required check ${required_check} is not successful on exact head ${HEAD_SHA}."
                  exit 1
                fi
              done
              echo "REVIEW_READINESS=PASS"
              echo "Independent human approval exists on the exact current PR head $HEAD_SHA and required governance checks are green."
              exit 0
            fi

            echo "REVIEW_READINESS=WAITING"
            echo "Waiting for a non-author human APPROVED review on exact head $HEAD_SHA."
            sleep "$poll_seconds"
          done
