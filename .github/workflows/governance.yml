name: TeamAi Governance

on:
  pull_request:
  push:
    branches:
      - main
      - governance/fail-closed-index-enforcement-2026-09-10

permissions:
  contents: read

concurrency:
  group: teamai-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-drift:
    name: governance-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check governance validator
        run: node --check scripts/governance/verify-active-index.mjs
      - name: Fail closed on active-index drift
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/governance/verify-active-index.mjs --mode=governance --base="$BASE_SHA"

  evidence-consistency:
    name: evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check governance validator
        run: node --check scripts/governance/verify-active-index.mjs
      - name: Fail closed on evidence inconsistency
        run: node scripts/governance/verify-active-index.mjs --mode=evidence

  agent-validation:
    name: agent-validation
    needs:
      - governance-drift
      - evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate agent validation packet from real validator output
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .validation
          node scripts/governance/verify-active-index.mjs --mode=governance --base="$BASE_SHA" --json > .validation/governance-verdict.json
          node scripts/governance/verify-active-index.mjs --mode=evidence --json > .validation/evidence-verdict.json
          node <<'NODE'
          const fs = require('node:fs');
          const governance = JSON.parse(fs.readFileSync('.validation/governance-verdict.json', 'utf8'));
          const evidence = JSON.parse(fs.readFileSync('.validation/evidence-verdict.json', 'utf8'));
          if (governance.verdict === 'FAIL' || evidence.verdict === 'FAIL') {
            throw new Error('governance validator reported FAIL');
          }
          const payload = {
            commit: process.env.COMMIT_SHA,
            base_commit: process.env.BASE_SHA || null,
            event: process.env.EVENT_NAME,
            governance_drift: governance.governance_drift,
            evidence_consistency: evidence.evidence_consistency,
            active_index_freshness: governance.active_index_freshness,
            historical_integrity: governance.historical_integrity,
            validated:
              governance.governance_drift === 'PASS' &&
              evidence.evidence_consistency === 'PASS' &&
              governance.active_index_freshness === 'PASS' &&
              governance.historical_integrity === 'PASS',
            verdict: 'AGENT-WORK-VALID',
          };
          if (!payload.validated) throw new Error('agent validation packet contains a non-PASS dimension');
          fs.writeFileSync('.validation/teamai-validation.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          cat .validation/teamai-validation.json
      - name: Publish validation packet
        uses: actions/upload-artifact@v4
        with:
          name: teamai-validation-${{ github.sha }}
          path: .validation/teamai-validation.json
          if-no-files-found: error
