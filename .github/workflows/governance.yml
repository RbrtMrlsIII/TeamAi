name: Repository Governance Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - governance/repository-foundation

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-drift:
    name: governance-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve governed PR proof base
        id: proof-context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$(gh api --method GET \
              "/repos/${REPO}/pulls" \
              -f state=open \
              -f head="${OWNER}:${REF_NAME}" \
              --jq '.[0].base.sha')"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "null" ]; then
            echo "No open PR base SHA could be resolved for governed branch ${REF_NAME}."
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "proof_base_sha=$base_sha"

      - name: Syntax check governance validators
        run: |
          node --check scripts/governance/verify-evidence-integrity.mjs
          python3 -m py_compile build-system/scripts/repository-canonical-governance-audit.py

      - name: Prove draft PR target against full PR delta
        env:
          BASE_SHA: ${{ steps.proof-context.outputs.base_sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build-system/scripts/repository-canonical-governance-audit.py

  evidence-consistency:
    name: evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify evidence boundaries
        run: node scripts/governance/verify-evidence-integrity.mjs

  agent-validation:
    name: agent-validation
    needs:
      - governance-drift
      - evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate agent validation packet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .validation
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            commit: process.env.COMMIT_SHA,
            base_commit: process.env.BASE_SHA || null,
            event: process.env.EVENT_NAME,
            governance_drift: 'PASS',
            evidence_consistency: 'PASS',
            validated: true,
            verdict: 'AGENT-WORK-VALID',
          };
          fs.writeFileSync('.validation/teamai-validation.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          cat .validation/teamai-validation.json
      - name: Publish validation packet
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: .validation/teamai-validation.json
          if-no-files-found: error

  review-readiness:
    name: review-readiness
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs:
      - governance-drift
      - evidence-consistency
      - agent-validation
    runs-on: ubuntu-latest
    steps:
      - name: Require an approval on the exact current PR head and block auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" > /tmp/reviews.json
          gh api "/repos/${REPO}/pulls/${PR_NUMBER}" > /tmp/pr.json
          auto_merge=$(jq -r 'if .auto_merge == null then "false" else "true" end' /tmp/pr.json)
          echo "auto_merge_enabled=$auto_merge"
          if [ "$auto_merge" = "true" ]; then
            echo "REVIEW_READINESS=FAIL"
            echo "TeamAi policy forbids auto-merge for product changes."
            exit 1
          fi
          approved=$(jq --arg head "$HEAD_SHA" --arg author "$PR_AUTHOR" '[.[] | select(.state == "APPROVED") | select(.commit_id == $head) | select(.user.login != $author)] | length' /tmp/reviews.json)
          echo "exact_head_approvals=$approved"
          if [ "$approved" -lt 1 ]; then
            echo "REVIEW_READINESS=FAIL"
            echo "No non-author approval exists for the exact current PR head $HEAD_SHA."
            exit 1
          fi
          echo "REVIEW_READINESS=PASS"
