name: Repository Governance Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - governance/fail-closed-index-enforcement-2026-09-10

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-drift:
    name: governance-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check governance validators
        run: |
          node --check scripts/governance/verify-active-index.mjs
          python3 -m py_compile build-system/scripts/repository-canonical-governance-audit.py
      - name: Enforce canonical repository foundation
        env:
          TEAMAI_PR_DRAFT: ${{ github.event.pull_request.draft || 'true' }}
          TEAMAI_PROMOTION_REVIEWED: ${{ vars.TEAMAI_PROMOTION_REVIEWED || '' }}
        run: python3 build-system/scripts/repository-canonical-governance-audit.py
      - name: Fail closed on active-index drift
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/governance/verify-active-index.mjs --mode=governance --base="$BASE_SHA"

  evidence-consistency:
    name: evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check governance validators
        run: |
          node --check scripts/governance/verify-active-index.mjs
          python3 -m py_compile build-system/scripts/repository-canonical-governance-audit.py
      - name: Fail closed on evidence inconsistency
        run: node scripts/governance/verify-active-index.mjs --mode=evidence

  agent-validation:
    name: agent-validation
    needs:
      - governance-drift
      - evidence-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate agent validation packet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .validation
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            commit: process.env.COMMIT_SHA,
            base_commit: process.env.BASE_SHA || null,
            event: process.env.EVENT_NAME,
            governance_drift: 'PASS',
            evidence_consistency: 'PASS',
            active_index_freshness: 'PASS',
            historical_integrity: 'PASS',
            validated: true,
            verdict: 'AGENT-WORK-VALID',
          };
          fs.writeFileSync('.validation/teamai-validation.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          cat .validation/teamai-validation.json
      - name: Publish validation packet
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-${{ github.sha }}
          path: .validation/teamai-validation.json
          if-no-files-found: error
